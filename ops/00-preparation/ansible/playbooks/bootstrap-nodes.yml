# Phase 00 节点基线：node_base → container_runtime（手册第 2、11 节）。
# 先 --check --diff --limit cp01，再实际执行 cp01，验证后按批次扩展（默认每批 1 台，-e bootstrap_serial=N）；
# check 模式不能代替实际验收。
- name: Phase 00 节点基线
  hosts: k8s_nodes
  serial: "{{ bootstrap_serial | default(1) }}"
  gather_facts: false
  roles:
    - role: node_base
    - role: container_runtime
      tags: [runtime]
