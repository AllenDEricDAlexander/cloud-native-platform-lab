# 构建客户端 build01（00.10.04 断网验收的干净客户端）：去除 Kubernetes 运行时 → 系统基线（DNS、CA、防火墙、日志）。
# 不设置 dnf 代理：工具链与依赖一律经 Nexus 获取（断网验收由 offline-acceptance.yml 执行）。
# 前提：已用 set-vm-identity.sh 设置为 build01.svc.internal.egon.top / 192.168.9.160。
- name: 构建客户端基线
  hosts: build01
  gather_facts: false
  roles:
    - role: service_vm
    - role: node_base
