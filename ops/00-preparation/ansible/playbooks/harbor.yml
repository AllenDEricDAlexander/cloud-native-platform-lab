# Harbor（00.09.02）：从封装模板克隆的服务 VM。
# 保留 containerd（Docker 使用）→ 系统基线与根 CA 信任 → Docker → Harbor；最后从管理端验证 HTTPS 与证书链。
# 前提：VM 已改为 harbor.k8s.internal.egon.top / 192.168.9.12、已分发管理端密钥、已新增 200G 数据盘；
# 管理端已有内部 CA 签发的证书（issue-cert.sh）与种子物料（Harbor 离线包、Docker RPM）。
- name: Harbor 服务器
  hosts: harbor
  gather_facts: false
  vars:
    service_vm_keep_containerd: true
  roles:
    - role: service_vm
    - role: node_base
    - role: docker_host
    - role: harbor

# 管理端验证单独成文件，重启或排障后可直接运行 verify-harbor.yml（隐式 localhost 不在 inventory 中，
# `harbor.yml --limit localhost` 会因没有匹配主机而直接报错，执行记录第 86 节）。
- name: 从管理端验证 Harbor
  ansible.builtin.import_playbook: verify-harbor.yml
