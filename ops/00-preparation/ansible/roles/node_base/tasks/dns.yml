- name: 客户端 DNS（DNS 服务器自身跳过）
  when: ansible_host not in node_dns_servers
  block:
    - name: 读取当前 DNS 与搜索域
      ansible.builtin.command: nmcli -g ipv4.dns,ipv4.dns-search,ipv6.ignore-auto-dns connection show {{ node_network_connection }}
      register: node_dns_current
      changed_when: false
      check_mode: false

    # 路由器经 IPv6 RA 下发的 DNS（如 fd5c:c6b4:3ca2::1）也会写入 resolv.conf，内部 DNS 超时时
    # glibc 会转而查询它，内部名称随之失败。只忽略 IPv6 自动 DNS，不关闭 IPv6（手册第 7 节）。
    - name: 改用内部 DNS（写入 NetworkManager 连接配置）
      ansible.builtin.command: >-
        nmcli connection modify {{ node_network_connection }}
        ipv4.dns "{{ node_dns_servers | join(' ') }}"
        ipv4.dns-search "{{ node_dns_search | join(' ') }}"
        ipv6.ignore-auto-dns yes
      when: node_dns_current.stdout_lines != [node_dns_servers | join(','), node_dns_search | join(','), 'yes']
      register: node_dns_modify
      notify: 重新应用网络连接

    - name: 让 DNS 设置立即生效
      ansible.builtin.meta: flush_handlers

    - name: 确认能解析内部与外部名称
      ansible.builtin.command: getent hosts {{ item }}
      loop: [harbor.k8s.internal.egon.top, rockylinux.org]
      changed_when: false
      check_mode: false

    - name: 读取 resolv.conf 中的 nameserver
      ansible.builtin.command: awk '/^nameserver/ {print $2}' /etc/resolv.conf
      register: node_resolv
      changed_when: false
      check_mode: false

    # reapply 不会清除已从路由器 RA 学到的 IPv6 DNS（执行记录第 86 节）。本次刚修改设置且仍有多余条目时，
    # 在后台重新激活连接（静态地址不变，只有短暂中断），等 SSH 恢复后再读一次。
    - name: 重新激活连接以清除已学到的 IPv6 DNS（后台执行，不中断当前任务）
      ansible.builtin.shell: nohup sh -c 'sleep 2; nmcli connection up {{ node_network_connection }}' >/dev/null 2>&1 &
      when: node_resolv.stdout_lines != node_dns_servers and node_dns_modify is changed
      register: node_dns_reactivated

    - name: 等待连接恢复
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 120
      when: node_dns_reactivated is changed

    - name: 重新激活后再次读取 resolv.conf
      ansible.builtin.command: awk '/^nameserver/ {print $2}' /etc/resolv.conf
      register: node_resolv_after
      changed_when: false
      when: node_dns_reactivated is changed

    - name: 系统解析只使用内部 DNS（resolv.conf 中没有其他 nameserver）
      ansible.builtin.assert:
        that: resolv_now == node_dns_servers
        fail_msg: >-
          resolv.conf 为 {{ resolv_now | join(',') }}。已从路由器 RA 学到的 IPv6 DNS 需要连接重新激活或重启后
          才清除（执行记录第 86 节）；请执行 reboot-nodes.yml 后重跑本标签。
        quiet: true
      vars:
        resolv_now: "{{ node_resolv_after.stdout_lines if node_resolv_after is not skipped else node_resolv.stdout_lines }}"
