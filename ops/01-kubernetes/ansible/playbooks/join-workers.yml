- name: 整批工作节点只读前检
  ansible.builtin.import_playbook: join-preflight.yml
  vars:
    phase01_join_hosts: k8s_nodes:!control_plane

- name: 按节点依次加入 infra、storage 与 worker
  hosts: k8s_nodes:!control_plane
  serial: 1
  any_errors_fatal: true
  gather_facts: false
  vars_files: [../vars/main.yml]
  vars:
    phase01_join_control_plane: false
  tasks:
    - name: 加入与核验工作节点
      ansible.builtin.include_tasks: ../tasks/join-node.yml

- name: 节点就绪后恢复 Cilium operator 目标副本数并核验
  ansible.builtin.import_playbook: install-cilium.yml
