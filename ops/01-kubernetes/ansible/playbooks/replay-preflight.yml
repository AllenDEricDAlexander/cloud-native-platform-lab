---
- name: 01.03–01.06 重跑输入、源码及只读前检
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  vars_files:
  - ../vars/replay.yml
  - ../vars/replay-catalog.yml
  tasks:
  - name: 校验执行模式及独立记录路径
    ansible.builtin.assert:
      that:
      - replay_mode in ['validate', 'run', 'images', 'recover', 'cleanup']
      - replay_records is defined
      - replay_records.startswith(replay_root ~ '/ops/01-kubernetes/records/2026-10-18-ansible-replay/runs/')
      - replay_records | realpath == replay_records
      - replay_topics | difference(['03', '04', '05', '06']) | length == 0
      - replay_topics | unique | list == replay_topics
      - replay_topics | sort == replay_topics
  - name: 创建本批记录目录
    ansible.builtin.file:
      path: '{{ replay_records }}/{{ item }}'
      state: directory
      mode: '0700'
    loop:
    - checkpoints
    - attempts
    - artifacts
    - state
  - name: 查询是否已有本批上下文
    ansible.builtin.stat:
      path: '{{ replay_records }}/context.json'
    register: replay_context_stat
  - name: 恢复已有上下文
    ansible.builtin.set_fact:
      replay_context: '{{ lookup(''file'', replay_records ~ ''/context.json'') | from_json }}'
    when: replay_context_stat.stat.exists
  - name: 查询是否已显式清理并结束本批
    ansible.builtin.stat:
      path: '{{ replay_records }}/state/closed-by-cleanup.json'
    register: replay_closed
  - name: 显式 cleanup 结束的批次不得沿用 PASS 再跑
    ansible.builtin.assert:
      that: replay_mode != 'run' or not replay_closed.stat.exists
  - name: recover 必须有原批上下文，不能生成一个新恢复批次
    ansible.builtin.assert:
      that: replay_mode not in ['recover','cleanup'] or replay_context_stat.stat.exists
  - name: 生成 UTC 批次时间
    ansible.builtin.command:
      argv:
      - date
      - -u
      - +%Y%m%dT%H%M%SZ
    register: replay_clock
    changed_when: false
  - name: 生成运行随机后缀
    ansible.builtin.command:
      argv:
      - uuidgen
    register: replay_nonce
    changed_when: false
  - name: 确定本批次与此次执行的身份
    ansible.builtin.set_fact:
      replay_run: '{{ replay_context.run if replay_context_stat.stat.exists else replay_clock.stdout ~ ''-'' ~ (replay_nonce.stdout | lower | replace(''-'',
        ''''))[0:8] }}'
      replay_attempt: '{{ replay_records }}/attempts/{{ replay_clock.stdout }}-{{ (replay_nonce.stdout | lower | replace(''-'', ''''))[0:8] }}'
  - name: 已有运行必须明确使用 resume
    ansible.builtin.assert:
      that: replay_resume | bool or replay_mode in ['validate','images','recover','cleanup']
    when: replay_context_stat.stat.exists
  - name: 拒绝不符合格式的批次身份
    ansible.builtin.assert:
      that: replay_run is match('^[0-9]{8}T[0-9]{6}Z-[a-f0-9]{8}$')
  - name: 创建此次执行的独立目录（旧输出不覆盖）
    ansible.builtin.file:
      path: '{{ replay_attempt }}/{{ item }}'
      state: directory
      mode: '0700'
    loop:
    - manifests
    - snapshots
    - observations
  - name: 核对工具链归档校验值
    ansible.builtin.stat:
      path: '{{ replay_go_archive }}'
      get_checksum: true
      checksum_algorithm: sha256
    register: replay_go_file
  - name: 确认使用原锁定编译器
    ansible.builtin.assert:
      that: replay_go_file.stat.checksum == replay_go_sha256
  - name: 查询编译器版本
    ansible.builtin.command:
      argv:
      - '{{ replay_go }}'
      - version
    register: replay_go_version
    changed_when: false
  - name: 拒绝非管理 Mac 工具链
    ansible.builtin.assert:
      that: replay_go_version.stdout == 'go version go1.27.2 darwin/arm64'
  - name: 记录实际来源 SHA 并确认原始执行记录未变
    ansible.builtin.command:
      argv:
      - '{{ replay_python }}'
      - '{{ replay_check }}'
      - audit
      - --root
      - '{{ replay_root }}'
      - --output
      - '{{ replay_attempt }}/implementation-sha256.json'
    register: replay_audit
    changed_when: false
  - name: 保存实际实现校验值
    ansible.builtin.set_fact:
      replay_implementation_sha: '{{ (replay_audit.stdout | from_json).source_sha256 }}'
  - name: 读取已有压力回退材料（若中断后恢复，必须先恢复再检查 worker 可调度）
    ansible.builtin.include_tasks: ../tasks/replay/pressure-recover.yml
    when: replay_context_stat.stat.exists
  - name: 同集群十节点及 restricted 基线只读检查
    ansible.builtin.command:
      argv:
      - '{{ replay_python }}'
      - '{{ replay_check }}'
      - preflight
    register: replay_health
    changed_when: false
  - name: 记录当前集群 UID
    ansible.builtin.set_fact:
      replay_cluster_uid: '{{ (replay_health.stdout | from_json).cluster_uid }}'
  - name: 已有上下文的任何模式都必须仍是原集群
    ansible.builtin.assert:
      that: replay_context.cluster_uid == replay_cluster_uid
    when: replay_context_stat.stat.exists
  - name: 续跑核对集群和资源源文件；拒绝混用不同版本
    ansible.builtin.assert:
      that:
      - replay_context.cluster_uid == replay_cluster_uid
      - replay_context.implementation == replay_implementation_sha
      - replay_context.topics == replay_topics
    when: replay_context_stat.stat.exists and replay_mode not in ['recover','cleanup']
  - name: 保存完整运行上下文（不含密钥、Token 或 kubeconfig 正文）
    ansible.builtin.copy:
      content: '{{ {''schema_version'': 2, ''run'': replay_run, ''cluster_uid'': replay_cluster_uid, ''root'': replay_root, ''records'': replay_records,
        ''topics'': replay_topics, ''implementation'': replay_implementation_sha} | to_nice_json }}

        '
      dest: '{{ replay_records }}/context.json'
      mode: '0600'
    when: not replay_context_stat.stat.exists
  - name: 运行本机有限行为测试
    ansible.builtin.command:
      argv:
      - '{{ replay_go }}'
      - test
      - -count=1
      - -timeout=30s
      - .
      chdir: '{{ replay_root }}/ops/01-kubernetes/core-resources/{{ item }}'
    loop:
    - probes
    - controllers
    environment:
      GOTOOLCHAIN: local
      GOPROXY: 'off'
      GOSUMDB: 'off'
      CGO_ENABLED: '0'
      GOOS: darwin
      GOARCH: arm64
    changed_when: false
    when: replay_mode not in ['recover','cleanup']
  - name: 验证 OCI 描述符、平台、版本与确定性打包
    ansible.builtin.command:
      argv:
      - '{{ replay_go }}'
      - test
      - -count=1
      - -timeout=30s
      - '{{ replay_root }}/ops/01-kubernetes/tools/imagepack.go'
      - '{{ replay_root }}/ops/01-kubernetes/tools/imagepack_test.go'
    environment:
      GOTOOLCHAIN: local
      GOPROXY: 'off'
      GOSUMDB: 'off'
      CGO_ENABLED: '0'
      GOOS: darwin
      GOARCH: arm64
    changed_when: false
    when: replay_mode not in ['recover','cleanup']
  - name: 交叉编译探针实验静态二进制
    ansible.builtin.command:
      argv:
      - '{{ replay_go }}'
      - build
      - -trimpath
      - -buildvcs=false
      - -ldflags=-s -w -buildid=
      - -o
      - '{{ replay_records }}/artifacts/probe-lab'
      - .
      chdir: '{{ replay_root }}/ops/01-kubernetes/core-resources/probes'
    environment:
      GOTOOLCHAIN: local
      GOPROXY: 'off'
      GOSUMDB: 'off'
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: amd64
      GOAMD64: v1
    changed_when: true
    when: replay_mode not in ['recover','cleanup']
  - name: 交叉编译控制器实验静态二进制
    ansible.builtin.command:
      argv:
      - '{{ replay_go }}'
      - build
      - -trimpath
      - -buildvcs=false
      - -ldflags=-s -w -buildid=
      - -o
      - '{{ replay_records }}/artifacts/controller-app'
      - .
      chdir: '{{ replay_root }}/ops/01-kubernetes/core-resources/controllers'
    environment:
      GOTOOLCHAIN: local
      GOPROXY: 'off'
      GOSUMDB: 'off'
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: amd64
      GOAMD64: v1
    changed_when: true
    when: replay_mode not in ['recover','cleanup']
  - name: Go 标准库打包两个实验的 OCI（不使用 Python 构造资源或镜像）
    ansible.builtin.command:
      argv:
      - '{{ replay_go }}'
      - run
      - '{{ replay_root }}/ops/01-kubernetes/tools/imagepack.go'
      - -family
      - '{{ item.family }}'
      - -source
      - '{{ replay_root }}/ops/01-kubernetes/core-resources/{{ item.family }}'
      - -binary
      - '{{ replay_records }}/artifacts/{{ item.binary }}'
      - -output
      - '{{ replay_records }}/artifacts/{{ item.output }}'
    loop:
    - family: probes
      binary: probe-lab
      output: probe.json
    - family: controllers
      binary: controller-app
      output: controllers.json
    environment:
      GOTOOLCHAIN: local
      GOPROXY: 'off'
      GOSUMDB: 'off'
      CGO_ENABLED: '0'
      GOOS: darwin
      GOARCH: arm64
    changed_when: true
    when: replay_mode not in ['recover','cleanup']
  - name: 加载精确镜像引用和应用脚本
    ansible.builtin.set_fact:
      probe_artifact: '{{ lookup(''file'', replay_records ~ ''/artifacts/probe.json'') | from_json }}'
      controller_bundle: '{{ lookup(''file'', replay_records ~ ''/artifacts/controllers.json'') | from_json }}'
      pod_app_script: '{{ lookup(''file'', replay_root ~ ''/ops/01-kubernetes/core-resources/pods/app.sh'') }}'
    when: replay_mode not in ['recover','cleanup']
  - name: 供资源模板使用的变量
    ansible.builtin.set_fact:
      probe_image: '{{ probe_artifact.image }}'
      controller_images: '{{ controller_bundle.images }}'
    when: replay_mode not in ['recover','cleanup']
  - name: 逐份校验源码结构和同名对象归属（实际创建/更新前另做服务端准入）
    ansible.builtin.include_tasks: ../tasks/replay/validate-resource.yml
    loop: '{{ replay_catalog }}'
    loop_control:
      loop_var: catalog_item
      label: '{{ catalog_item.topic }}/{{ catalog_item.id }}'
    when: replay_mode not in ['recover','cleanup']
  - name: 交付/运行前检完成
    ansible.builtin.debug:
      msg: REPLAY SOURCE SCHEMA PASS；保留现场不影响目录校验；实际 create/apply 前逐资源执行 server dry-run
    when: replay_mode not in ['recover','cleanup']
