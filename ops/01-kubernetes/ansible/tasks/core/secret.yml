---
# Secret 只在管理端私有目录渲染；server-side apply 不写含私密数据的 last-applied annotation。
- name: 私有 Secret 源码类型必须明确
  ansible.builtin.assert:
    that: core_secret_source is match('^(core-resources)/[a-zA-Z0-9_./-]+\.j2$') and '..' not in core_secret_source.split('/')
- name: Secret 私有渲染与执行
  no_log: true
  block:
    - name: 从源码生成私有 Secret YAML
      ansible.builtin.template:
        src: '{{ core_root }}/ops/01-kubernetes/{{ core_secret_source }}'
        dest: '{{ core_private }}/{{ core_secret_name }}.yaml'
        mode: '0600'
    - name: 私有资源也必须核对类型、命名空间和归属
      ansible.builtin.assert:
        that:
          - secret.kind == 'Secret' and secret.metadata.name == core_secret_name
          - secret.metadata.namespace == core_secret_namespace | default(core_namespace)
          - secret.metadata.labels['cnpl.io/core-run'] == core_run
          - secret.type in ['Opaque','kubernetes.io/tls','kubernetes.io/dockerconfigjson']
      vars: {secret: '{{ lookup("file",core_private ~ "/" ~ core_secret_name ~ ".yaml") | from_yaml }}'}
    - name: 只读取同名 Secret 的归属标签
      ansible.builtin.command:
        argv: "{{ core_a + ['get', 'secret', core_secret_name, '-n', core_secret_namespace | default(core_namespace), '--ignore-not-found', '-o', 'jsonpath={.metadata.uid}{\"|\"}{.metadata.labels.cnpl\\.io/core-run}{\"|\"}{.metadata.labels.cnpl\\.io/component}{\"|\"}{.metadata.labels.cnpl\\.io/cluster-uid}'] }}"
      register: core_secret_owner
      changed_when: false
    - name: 拒绝覆盖其他运行的 Secret
      ansible.builtin.assert:
        that: core_secret_owner.stdout == '' or core_secret_owner.stdout.split('|')[1] == core_run or (core_addon | default(false) and core_secret_owner.stdout.split('|')[2:] == ['metrics-server',core_cluster_uid])
    - name: 私有 Secret 服务端准入
      ansible.builtin.command:
        argv: "{{ core_a + ['apply', '--server-side', '--field-manager=cnpl-core-lab', '--dry-run=server', '-f', core_private ~ '/' ~ core_secret_name ~ '.yaml'] }}"
      changed_when: false
    - name: 仅提交当前私有 Secret
      ansible.builtin.command:
        argv: "{{ core_a + ['apply', '--server-side', '--field-manager=cnpl-core-lab', '-f', core_private ~ '/' ~ core_secret_name ~ '.yaml'] }}"
      changed_when: true
