---
- name: 校验 {{ core_catalog_item.id }} 源码
  ansible.builtin.include_tasks: resource.yml
  vars:
    core_source: '{{ core_catalog_item.source }}'
    core_resource_id: 'schema-{{ core_catalog_item.id }}'
    core_resource_admin: true
    core_addon: '{{ core_catalog_item.addon | default(false) }}'
    state_name: '{{ params.state_name | default("p07-state") }}'
    state_count: '{{ params.state_count | default(2) }}'
    state_policy: '{{ params.state_policy | default("OrderedReady") }}'
    state_strategy: '{{ params.state_strategy | default("RollingUpdate") }}'
    state_partition: '{{ params.state_partition | default(0) }}'
    state_version: '{{ params.state_version | default("v1") }}'
    state_block: '{{ params.state_block | default("") }}'
    daemon_version: '{{ params.daemon_version | default("v1") }}'
    daemon_strategy: '{{ params.daemon_strategy | default("RollingUpdate") }}'
    daemon_tolerate: '{{ params.daemon_tolerate | default(false) }}'
    gc_name: '{{ params.gc_name | default("p08-foreground") }}'
    gc_pool: '{{ params.gc_pool | default(params.gc_name | default("p08-foreground")) }}'
    gc_kind: '{{ params.gc_kind | default("Deployment") }}'
    job_mode: '{{ params.job_mode | default("retry") }}'
    cron_policy: '{{ params.cron_policy | default("Allow") }}'
    cron_suspend: '{{ params.cron_suspend | default(false) }}'
    load_name: '{{ params.load_name | default("p09-load") }}'
    load_mode: '{{ params.load_mode | default("off") }}'
    load_cpu_request: '{{ params.load_cpu_request | default("50m") }}'
    hpa_resource: '{{ params.hpa_resource | default("cpu") }}'
    config_name: '{{ params.config_name | default("p10-config") }}'
    config_value: '{{ params.config_value | default("v1") }}'
    config_immutable: '{{ params.config_immutable | default(false) }}'
    rbac_pod: '{{ params.rbac_pod | default("p10-reader") }}'
    rbac_sa: '{{ params.rbac_sa | default("p10-reader") }}'
    rbac_token: '{{ params.rbac_token | default(true) }}'
    rbac_audience: '{{ params.rbac_audience | default(core_api_audience) }}'
    core_harbor_project: cnpl-p10-schema-only
    pull_variant: '{{ params.pull_variant | default("v1") }}'
    core_kubelet_ca_pem: '{{ core_schema_ca }}'
    core_metrics_ca_pem: '{{ core_schema_ca }}'
    params: '{{ core_catalog_item.params | default({}) }}'
