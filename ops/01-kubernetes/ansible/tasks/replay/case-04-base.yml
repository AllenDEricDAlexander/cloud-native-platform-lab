---
- name: resource.yml
  ansible.builtin.include_tasks: resource.yml
  vars:
    resource_source: core-resources/pods/manifests/p04-budget.yaml.j2
    resource_id: p04-budget
    resource_action: create
    resource_admin: true
- name: resource.yml
  ansible.builtin.include_tasks: resource.yml
  vars:
    resource_source: core-resources/pods/manifests/p04-defaults.yaml.j2
    resource_id: p04-defaults
    resource_action: create
    resource_admin: true
- name: resource.yml
  ansible.builtin.include_tasks: resource.yml
  vars:
    resource_source: core-resources/pods/manifests/p04-isolation.yaml.j2
    resource_id: p04-isolation
    resource_action: create
    resource_admin: false
- name: resource.yml
  ansible.builtin.include_tasks: resource.yml
  vars:
    resource_source: core-resources/pods/manifests/p04-app.yaml.j2
    resource_id: p04-app
    resource_action: create
    resource_admin: false
- name: resource.yml
  ansible.builtin.include_tasks: resource.yml
  vars:
    resource_source: core-resources/pods/manifests/p04-baseline.yaml.j2
    resource_id: p04-baseline
    resource_action: create
    resource_admin: false
- name: resource.yml
  ansible.builtin.include_tasks: resource.yml
  vars:
    resource_source: core-resources/pods/manifests/p04-entry.yaml.j2
    resource_id: p04-entry
    resource_action: create
    resource_admin: false
- name: wait-ready.yml
  ansible.builtin.include_tasks: wait-ready.yml
  vars:
    ready_resource: pod/p04-baseline
- name: 基准应用返回实例信息
  ansible.builtin.command:
    argv: '{{ replay_k + [''-n'', replay_namespace, ''exec'', ''p04-baseline'', ''--'', ''/bin/sh'', ''-ec'', ''wget -q -T 5 -O - http://127.0.0.1:8080/'']
      }}'
  changed_when: false
  register: baseline_http
- name: 基准请求来自本 Pod
  ansible.builtin.assert:
    that:
    - '''p04-baseline'' in baseline_http.stdout'
- name: 准备就绪开关反例
  block:
  - name: 关闭就绪开关
    ansible.builtin.command:
      argv: '{{ replay_k + [''-n'', replay_namespace, ''exec'', ''p04-baseline'', ''--'', ''rm'', ''/work/ready''] }}'
    changed_when: true
  - name: 读取真实 503
    ansible.builtin.command:
      argv: '{{ replay_k + [''-n'', replay_namespace, ''exec'', ''p04-baseline'', ''--'', ''wget'', ''-T'', ''3'', ''-O'', ''-'', ''http://127.0.0.1:8080/cgi-bin/check?ready'']
        }}'
    changed_when: false
    register: false_ready
    failed_when: false
  - name: 必须取得 HTTP 503
    ansible.builtin.assert:
      that:
      - false_ready.rc != 0
      - '''503'' in false_ready.stderr'
  always:
  - name: 还原就绪开关
    ansible.builtin.command:
      argv: '{{ replay_k + [''-n'', replay_namespace, ''exec'', ''p04-baseline'', ''--'', ''touch'', ''/work/ready''] }}'
    changed_when: true
- name: wait-ready.yml
  ansible.builtin.include_tasks: wait-ready.yml
  vars:
    ready_resource: pod/p04-baseline
