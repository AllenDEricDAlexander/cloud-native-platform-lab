---
- name: 创建没有 shell 的源码 Pod
  ansible.builtin.include_tasks: resource.yml
  vars: {resource_source: core-resources/pods/manifests/p04-shellless.yaml.j2, resource_id: p04-shellless}
- name: 等待目标 Pod 就绪
  ansible.builtin.include_tasks: wait-ready.yml
  vars: {ready_resource: pod/p04-shellless}
- name: 证实镜像没有 shell
  ansible.builtin.command:
    argv: "{{ replay_k + ['-n', replay_namespace, 'exec', 'p04-shellless', '--', '/bin/sh', '-ec', 'true'] }}"
  register: no_shell
  changed_when: false
  failed_when: no_shell.rc == 0 or not (no_shell.stderr is search('no such file|not found|executable file'))
- name: 保留缺少 shell 的实际输出
  ansible.builtin.copy:
    content: '{{ no_shell.stderr }}'
    dest: '{{ replay_attempt }}/observations/04-debug-no-shell.txt'
    mode: '0600'
- name: 有界临时调试并始终还原延迟开关
  block:
    - name: 开启两秒响应延迟
      ansible.builtin.command:
        argv: "{{ replay_k + ['-n', replay_namespace, 'exec', 'p04-baseline', '--', '/bin/sh', '-ec', 'echo 2 > /work/delay'] }}"
      changed_when: true
    - name: 从源码安全配置及诊断脚本启动临时容器
      ansible.builtin.command:
        argv: "{{ replay_k + ['-n', replay_namespace, 'debug', 'p04-shellless', '--image=' ~ replay_busybox, '--container=diag', '--target=app', '--profile=restricted', '--custom=' ~ replay_root ~ '/ops/01-kubernetes/core-resources/pods/debug-profile.yml', '--attach=false', '--', '/bin/sh', '-ec', lookup('file', replay_root ~ '/ops/01-kubernetes/core-resources/pods/debug.sh')] }}"
      changed_when: true
    - name: 等待有限诊断退出成功
      ansible.builtin.include_tasks: wait-field.yml
      vars:
        wait_resource: pod/p04-shellless
        wait_field: '{.status.ephemeralContainerStatuses[?(@.name=="diag")].state.terminated.exitCode}'
        wait_values: ['0']
    - name: 读取诊断结果
      ansible.builtin.command:
        argv: "{{ replay_k + ['-n', replay_namespace, 'logs', 'p04-shellless', '-c', 'diag'] }}"
      register: debug_log
      changed_when: false
    - name: DNS、拒绝连接与慢响应实验均完成
      ansible.builtin.assert:
        that: "'DEBUG_COMPLETE' in debug_log.stdout"
    - name: 保存完整诊断输出
      ansible.builtin.copy:
        content: '{{ debug_log.stdout }}'
        dest: '{{ replay_attempt }}/observations/04-debug-result.txt'
        mode: '0600'
  always:
    - name: 还原基准应用延迟开关
      ansible.builtin.command:
        argv: "{{ replay_k + ['-n', replay_namespace, 'exec', 'p04-baseline', '--', '/bin/sh', '-ec', 'echo 0 > /work/delay'] }}"
      changed_when: true
- name: 应用默认 SA 不具备临时容器修改权限
  ansible.builtin.command:
    argv: "{{ replay_a + ['auth', 'can-i', 'patch', 'pods/ephemeralcontainers', '-n', replay_namespace, '--as=system:serviceaccount:lab-core:default'] }}"
  register: sa_permission
  changed_when: false
  failed_when: sa_permission.rc != 1 or sa_permission.stdout != 'no'
