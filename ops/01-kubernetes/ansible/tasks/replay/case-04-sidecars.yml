---
- name: resource.yml
  ansible.builtin.include_tasks: resource.yml
  vars:
    resource_source: core-resources/pods/manifests/p04-init.yaml.j2
    resource_id: p04-init
    resource_action: create
    resource_admin: false
- name: wait-field.yml
  ansible.builtin.include_tasks: wait-field.yml
  vars:
    wait_resource: pod/p04-init
    wait_field: '{.status.initContainerStatuses[0].restartCount}'
    wait_min: 1
- name: get.yml
  ansible.builtin.include_tasks: get.yml
  vars:
    get_kind: pod
    get_name: p04-init
- name: 失败 init 阻挡主容器
  ansible.builtin.assert:
    that:
    - not (replay_object.status.containerStatuses | default([]) | selectattr('state.running', 'defined') | list)
- name: snapshot.yml
  ansible.builtin.include_tasks: snapshot.yml
- name: resource.yml
  ansible.builtin.include_tasks: resource.yml
  vars:
    resource_source: core-resources/pods/manifests/p04-init.yaml.j2
    resource_id: p04-init
    resource_action: delete
    resource_admin: false
- name: resource.yml
  ansible.builtin.include_tasks: resource.yml
  vars:
    resource_source: core-resources/pods/manifests/p04-init-fixed.yaml.j2
    resource_id: p04-init-fixed
    resource_action: create
    resource_admin: false
- name: wait-ready.yml
  ansible.builtin.include_tasks: wait-ready.yml
  vars:
    ready_resource: pod/p04-init
- name: resource.yml
  ansible.builtin.include_tasks: resource.yml
  vars:
    resource_source: core-resources/pods/manifests/p04-ordinary.yaml.j2
    resource_id: p04-ordinary
    resource_action: create
    resource_admin: false
- name: resource.yml
  ansible.builtin.include_tasks: resource.yml
  vars:
    resource_source: core-resources/pods/manifests/p04-native.yaml.j2
    resource_id: p04-native
    resource_action: create
    resource_admin: false
- name: wait-field.yml
  ansible.builtin.include_tasks: wait-field.yml
  vars:
    wait_resource: pod/p04-ordinary
    wait_field: '{.status.containerStatuses[?(@.name=="app")].state.terminated.exitCode}'
    wait_values:
    - '0'
- name: get.yml
  ansible.builtin.include_tasks: get.yml
  vars:
    get_kind: pod
    get_name: p04-ordinary
- name: 普通 sidecar 继续存活
  ansible.builtin.assert:
    that:
    - replay_object.status.phase == 'Running'
    - (replay_object.status.containerStatuses | selectattr('name','equalto','side') | first).state.running is defined
- name: 显式停止普通 sidecar
  ansible.builtin.command:
    argv: '{{ replay_k + [''-n'', replay_namespace, ''exec'', ''p04-ordinary'', ''-c'', ''side'', ''--'', ''touch'', ''/work/stop''] }}'
  changed_when: true
- name: wait-field.yml
  ansible.builtin.include_tasks: wait-field.yml
  vars:
    wait_resource: pod/p04-ordinary
    wait_field: '{.status.phase}'
    wait_values:
    - Succeeded
- name: wait-field.yml
  ansible.builtin.include_tasks: wait-field.yml
  vars:
    wait_resource: pod/p04-native
    wait_field: '{.status.phase}'
    wait_values:
    - Succeeded
- name: 读取原生 sidecar 启停轨迹
  ansible.builtin.command:
    argv: '{{ replay_k + [''-n'', replay_namespace, ''logs'', ''p04-native'', ''-c'', ''side''] }}'
  changed_when: false
  register: native_trace
- name: 原生 sidecar 有完整有序回执
  ansible.builtin.assert:
    that:
    - native_trace.stdout is search('(?s)init-done.*side-start.*main-start.*main-stop.*side-stop')
- name: 保存 native-trace
  ansible.builtin.copy:
    content: '{{ {"trace": native_trace.stdout} | to_nice_json }}'
    dest: '{{ replay_attempt }}/observations/04-{{ replay_case }}-native-trace.json'
    mode: '0600'
