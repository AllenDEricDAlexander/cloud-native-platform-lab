---
- name: 源码清单 p05-protocol-http
  ansible.builtin.include_tasks: resource.yml
  vars:
    resource_source: core-resources/probes/manifests/p05-protocol-http.yaml.j2
    resource_id: p05-protocol-http
    resource_action: create
- name: wait-ready.yml
  ansible.builtin.include_tasks: wait-ready.yml
  vars:
    ready_resource: pod/p05-protocol-http
- name: 在本批 Pod 注入 business=True
  ansible.builtin.command:
    argv: '{{ replay_k + [''-n'', replay_namespace, ''exec'', ''p05-protocol-http'', ''--'', ''/probe-lab'', ''control'',
      ''business'', ''true''] }}'
  changed_when: true
- name: wait-field.yml
  ansible.builtin.include_tasks: wait-field.yml
  vars:
    wait_resource: pod/p05-protocol-http
    wait_field: '{.status.conditions[?(@.type=="Ready")].status}'
    wait_values:
    - 'False'
- name: inspect.yml
  ansible.builtin.include_tasks: inspect.yml
  vars:
    inspect_pod: p05-protocol-http
    inspect_id: p05-protocol-http
    inspect_path: /metrics
    inspect_port: 8080
- name: 业务失败而本地仍存活
  ansible.builtin.assert:
    that:
    - inspection.live | bool
    - not inspection.ready
- name: 在本批 Pod 注入 business=False
  ansible.builtin.command:
    argv: '{{ replay_k + [''-n'', replay_namespace, ''exec'', ''p05-protocol-http'', ''--'', ''/probe-lab'', ''control'',
      ''business'', ''false''] }}'
  changed_when: true
- name: wait-ready.yml
  ansible.builtin.include_tasks: wait-ready.yml
  vars:
    ready_resource: pod/p05-protocol-http
- name: 源码清单 p05-protocol-tcp
  ansible.builtin.include_tasks: resource.yml
  vars:
    resource_source: core-resources/probes/manifests/p05-protocol-tcp.yaml.j2
    resource_id: p05-protocol-tcp
    resource_action: create
- name: wait-ready.yml
  ansible.builtin.include_tasks: wait-ready.yml
  vars:
    ready_resource: pod/p05-protocol-tcp
- name: 在本批 Pod 注入 business=True
  ansible.builtin.command:
    argv: '{{ replay_k + [''-n'', replay_namespace, ''exec'', ''p05-protocol-tcp'', ''--'', ''/probe-lab'', ''control'', ''business'',
      ''true''] }}'
  changed_when: true
- name: 覆盖多次 TCP 探测
  ansible.builtin.pause:
    seconds: 8
- name: wait-ready.yml
  ansible.builtin.include_tasks: wait-ready.yml
  vars:
    ready_resource: pod/p05-protocol-tcp
- name: inspect.yml
  ansible.builtin.include_tasks: inspect.yml
  vars:
    inspect_pod: p05-protocol-tcp
    inspect_id: p05-protocol-tcp
    inspect_path: /metrics
    inspect_port: 8080
- name: 业务失败而本地仍存活
  ansible.builtin.assert:
    that:
    - inspection.live | bool
    - not inspection.ready
- name: 在本批 Pod 注入 business=False
  ansible.builtin.command:
    argv: '{{ replay_k + [''-n'', replay_namespace, ''exec'', ''p05-protocol-tcp'', ''--'', ''/probe-lab'', ''control'', ''business'',
      ''false''] }}'
  changed_when: true
- name: wait-ready.yml
  ansible.builtin.include_tasks: wait-ready.yml
  vars:
    ready_resource: pod/p05-protocol-tcp
- name: 源码清单 p05-protocol-exec
  ansible.builtin.include_tasks: resource.yml
  vars:
    resource_source: core-resources/probes/manifests/p05-protocol-exec.yaml.j2
    resource_id: p05-protocol-exec
    resource_action: create
- name: wait-ready.yml
  ansible.builtin.include_tasks: wait-ready.yml
  vars:
    ready_resource: pod/p05-protocol-exec
- name: 在本批 Pod 注入 business=True
  ansible.builtin.command:
    argv: '{{ replay_k + [''-n'', replay_namespace, ''exec'', ''p05-protocol-exec'', ''--'', ''/probe-lab'', ''control'',
      ''business'', ''true''] }}'
  changed_when: true
- name: wait-field.yml
  ansible.builtin.include_tasks: wait-field.yml
  vars:
    wait_resource: pod/p05-protocol-exec
    wait_field: '{.status.conditions[?(@.type=="Ready")].status}'
    wait_values:
    - 'False'
- name: inspect.yml
  ansible.builtin.include_tasks: inspect.yml
  vars:
    inspect_pod: p05-protocol-exec
    inspect_id: p05-protocol-exec
    inspect_path: /metrics
    inspect_port: 8080
- name: 业务失败而本地仍存活
  ansible.builtin.assert:
    that:
    - inspection.live | bool
    - not inspection.ready
- name: 在本批 Pod 注入 business=False
  ansible.builtin.command:
    argv: '{{ replay_k + [''-n'', replay_namespace, ''exec'', ''p05-protocol-exec'', ''--'', ''/probe-lab'', ''control'',
      ''business'', ''false''] }}'
  changed_when: true
- name: wait-ready.yml
  ansible.builtin.include_tasks: wait-ready.yml
  vars:
    ready_resource: pod/p05-protocol-exec
- name: 源码清单 p05-grpc-good
  ansible.builtin.include_tasks: resource.yml
  vars:
    resource_source: core-resources/probes/manifests/p05-grpc-good.yaml.j2
    resource_id: p05-grpc-good
    resource_action: create
- name: wait-ready.yml
  ansible.builtin.include_tasks: wait-ready.yml
  vars:
    ready_resource: pod/p05-grpc-good
- name: etcd 业务仍健康（不会用错误 readiness 重启它）
  ansible.builtin.command:
    argv: '{{ replay_k + [''-n'', replay_namespace, ''exec'', ''p05-grpc-good'', ''--'', ''/usr/local/bin/etcdctl'', ''--endpoints=http://127.0.0.1:2379'',
      ''endpoint'', ''health''] }}'
  changed_when: false
  register: grpc_health
- name: 源码清单 p05-grpc-wrong-service
  ansible.builtin.include_tasks: resource.yml
  vars:
    resource_source: core-resources/probes/manifests/p05-grpc-wrong-service.yaml.j2
    resource_id: p05-grpc-wrong-service
    resource_action: create
- name: wait-field.yml
  ansible.builtin.include_tasks: wait-field.yml
  vars:
    wait_resource: pod/p05-grpc-wrong-service
    wait_field: '{.status.containerStatuses[0].started}'
    wait_values:
    - 'true'
- name: get.yml
  ansible.builtin.include_tasks: get.yml
  vars:
    get_kind: pod
    get_name: p05-grpc-wrong-service
- name: 绑定错误 service 的当前 UID
  ansible.builtin.set_fact:
    grpc_bad: '{{ replay_object }}'
- name: 读取原生 gRPC service 不存在的真实事件
  ansible.builtin.command:
    argv: '{{ replay_k + [''-n'', replay_namespace, ''get'', ''events'', ''--field-selector'', ''involvedObject.uid='' ~ grpc_bad.metadata.uid,
      ''-o'', ''json''] }}'
  changed_when: false
  until: grpc_events.rc == 0 and ('NotFound' in grpc_events.stdout or 'unknown service' in grpc_events.stdout)
  retries: 45
  delay: 1
  register: grpc_events
- name: wait-field.yml
  ansible.builtin.include_tasks: wait-field.yml
  vars:
    wait_resource: pod/p05-grpc-wrong-service
    wait_field: '{.status.conditions[?(@.type=="Ready")].status}'
    wait_values:
    - 'False'
- name: etcd 业务仍健康（不会用错误 readiness 重启它）
  ansible.builtin.command:
    argv: '{{ replay_k + [''-n'', replay_namespace, ''exec'', ''p05-grpc-wrong-service'', ''--'', ''/usr/local/bin/etcdctl'',
      ''--endpoints=http://127.0.0.1:2379'', ''endpoint'', ''health''] }}'
  changed_when: false
  register: grpc_health
- name: snapshot.yml
  ansible.builtin.include_tasks: snapshot.yml
