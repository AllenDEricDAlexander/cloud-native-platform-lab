    resource_id: p05-start-over
    resource_action: create
- name: wait-field.yml
  ansible.builtin.include_tasks: wait-field.yml
  vars:
    wait_resource: pod/p05-start-over
    wait_field: '{.status.containerStatuses[0].restartCount}'
    wait_min: 1
- name: snapshot.yml
  ansible.builtin.include_tasks: snapshot.yml
- name: 取得超出启动窗口 Pod 的失败事件
  ansible.builtin.include_tasks: get.yml
  vars:
    get_kind: pod
    get_name: p05-start-over
- name: 必须有实际 kubelet startup 失败事件
  ansible.builtin.command:
    argv: '{{ replay_k + [''-n'', replay_namespace, ''get'', ''events'', ''--field-selector=involvedObject.uid='' ~ replay_object.metadata.uid,
      ''-o'', ''json''] }}'
  register: startup_failed_events
  changed_when: false
  until: startup_failed_events.rc == 0 and 'Startup probe failed' in startup_failed_events.stdout
  retries: 20
  delay: 1
