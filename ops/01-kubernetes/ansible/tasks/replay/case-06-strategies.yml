---
- name: cleanup.yml
  ansible.builtin.include_tasks: cleanup.yml
- name: RollingUpdate-v1
  ansible.builtin.include_tasks: resource.yml
  vars:
    resource_id: RollingUpdate-v1
    resource_source: core-resources/controllers/manifests/deployment.yaml.j2
    resource_action: create
- name: RollingUpdate-service
  ansible.builtin.include_tasks: resource.yml
  vars:
    resource_id: RollingUpdate-service
    resource_source: core-resources/controllers/manifests/service.yaml.j2
    resource_action: create
- name: wait-deployment.yml
  ansible.builtin.include_tasks: wait-deployment.yml
- name: observer.yml
  ansible.builtin.include_tasks: observer.yml
- name: 检查真实业务 RollingUpdate-before
  ansible.builtin.include_tasks: samples.yml
  vars:
    sample_id: RollingUpdate-before
    sample_version: v1
    sample_pod: p06-client
- name: start-observer.yml
  ansible.builtin.include_tasks: start-observer.yml
  vars:
    observer_id: RollingUpdate
    observer_extra:
    - --deployment
    - p06-main
- name: RollingUpdate-v2
  ansible.builtin.include_tasks: resource.yml
  vars:
    resource_id: RollingUpdate-v2
    resource_source: core-resources/controllers/manifests/deployment.yaml.j2
    resource_action: apply
    workload_image: '{{ controller_images.v2.image }}'
    variant: v2
- name: wait-deployment.yml
  ansible.builtin.include_tasks: wait-deployment.yml
- name: 检查真实业务 RollingUpdate-after
  ansible.builtin.include_tasks: samples.yml
  vars:
    sample_id: RollingUpdate-after
    sample_version: v2
    sample_pod: p06-client
- name: 再保留一秒流量采样
  ansible.builtin.pause:
    seconds: 1
- name: stop-observer.yml
  ansible.builtin.include_tasks: stop-observer.yml
- name: RollingUpdate 的实际请求结果
  ansible.builtin.assert:
    that:
    - observer_result.errors == 0
- name: 保存 strategy-RollingUpdate
  ansible.builtin.copy:
    content: '{{ observer_result | to_nice_json }}'
    dest: '{{ replay_attempt }}/observations/{{ replay_topic }}-{{ replay_case }}-strategy-RollingUpdate.json'
    mode: '0600'
- name: RS 期望预算保持 replicas+maxSurge=3
  ansible.builtin.assert:
    that:
    - observer_result.graphs | selectattr('desired_rs_replicas', 'defined') | map(attribute='desired_rs_replicas') | max <=
      3
- name: 记录容量反例前的完整模板和 revision
  ansible.builtin.set_fact:
    good_revision: '{{ deployment_state.deployment.metadata.annotations[''deployment.kubernetes.io/revision''] }}'
    good_template: '{{ deployment_state.deployment.spec.template }}'
- name: start-observer.yml
  ansible.builtin.include_tasks: start-observer.yml
  vars:
    observer_id: blocked-surge
- name: blocked-surge
  ansible.builtin.include_tasks: resource.yml
  vars:
    resource_id: blocked-surge
    resource_source: core-resources/controllers/manifests/deployment.yaml.j2
    resource_action: apply
    workload_image: '{{ controller_images.v2.image }}'
    variant: surge-capacity
    cpu_request: '8'
    cpu_limit: '8'
- name: case-06-capacity-check.yml
  ansible.builtin.include_tasks: case-06-capacity-check.yml
  vars:
    capacity_variant: surge-capacity
- name: 读取 deployment/p06-main
  ansible.builtin.include_tasks: get.yml
  vars:
    get_kind: deployment
    get_name: p06-main
- name: surge 受阻时旧两个副本继续可用
  ansible.builtin.assert:
    that:
    - replay_object.status.availableReplicas == 2
- name: undo.yml
  ansible.builtin.include_tasks: undo.yml
  vars:
    restore_id: surge-capacity
- name: stop-observer.yml
  ansible.builtin.include_tasks: stop-observer.yml
- name: 容量阻塞及恢复期间无业务错误
  ansible.builtin.assert:
    that:
    - observer_result.errors == 0
- name: cleanup.yml
  ansible.builtin.include_tasks: cleanup.yml
- name: Recreate-v1
  ansible.builtin.include_tasks: resource.yml
  vars:
    resource_id: Recreate-v1
    resource_source: core-resources/controllers/manifests/deployment-recreate.yaml.j2
    resource_action: create
- name: Recreate-service
  ansible.builtin.include_tasks: resource.yml
  vars:
    resource_id: Recreate-service
    resource_source: core-resources/controllers/manifests/service.yaml.j2
    resource_action: create
- name: wait-deployment.yml
  ansible.builtin.include_tasks: wait-deployment.yml
- name: observer.yml
  ansible.builtin.include_tasks: observer.yml
- name: 检查真实业务 Recreate-before
  ansible.builtin.include_tasks: samples.yml
  vars:
    sample_id: Recreate-before
    sample_version: v1
    sample_pod: p06-client
- name: start-observer.yml
  ansible.builtin.include_tasks: start-observer.yml
  vars:
    observer_id: Recreate
    observer_extra:
    - --deployment
    - p06-main
- name: Recreate-v2
  ansible.builtin.include_tasks: resource.yml
  vars:
    resource_id: Recreate-v2
    resource_source: core-resources/controllers/manifests/deployment-recreate.yaml.j2
    resource_action: apply
    workload_image: '{{ controller_images.v2.image }}'
    variant: v2
- name: wait-deployment.yml
  ansible.builtin.include_tasks: wait-deployment.yml
- name: 检查真实业务 Recreate-after
  ansible.builtin.include_tasks: samples.yml
  vars:
    sample_id: Recreate-after
    sample_version: v2
    sample_pod: p06-client
- name: 再保留一秒流量采样
  ansible.builtin.pause:
    seconds: 1
- name: stop-observer.yml
  ansible.builtin.include_tasks: stop-observer.yml
- name: Recreate 的实际请求结果
  ansible.builtin.assert:
    that:
    - observer_result.errors > 0
- name: 保存 strategy-Recreate
  ansible.builtin.copy:
    content: '{{ observer_result | to_nice_json }}'
    dest: '{{ replay_attempt }}/observations/{{ replay_topic }}-{{ replay_case }}-strategy-Recreate.json'
    mode: '0600'
