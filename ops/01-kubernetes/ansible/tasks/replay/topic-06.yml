---
- name: 开始 01.06：资源定义来自源码 YAML，操作由 Ansible 执行
  ansible.builtin.set_fact:
    replay_topic: '06'
- name: 01.06 base
  ansible.builtin.include_tasks: case.yml
  vars:
    replay_case: base
    replay_case_tasks: case-06-base.yml
    replay_case_keep: true
- name: 01.06 replicas
  ansible.builtin.include_tasks: case.yml
  vars:
    replay_case: replicas
    replay_case_tasks: case-06-replicas.yml
- name: 01.06 history
  ansible.builtin.include_tasks: case.yml
  vars:
    replay_case: history
    replay_case_tasks: case-06-history.yml
- name: 01.06 scale
  ansible.builtin.include_tasks: case.yml
  vars:
    replay_case: scale
    replay_case_tasks: case-06-scale.yml
- name: 01.06 strategies
  ansible.builtin.include_tasks: case.yml
  vars:
    replay_case: strategies
    replay_case_tasks: case-06-strategies.yml
- name: 01.06 rollbacks
  ansible.builtin.include_tasks: case.yml
  vars:
    replay_case: rollbacks
    replay_case_tasks: case-06-rollbacks.yml
- name: 01.06 split
  ansible.builtin.include_tasks: case.yml
  vars:
    replay_case: split
    replay_case_tasks: case-06-split.yml
- name: 01.06 cleanup
  ansible.builtin.include_tasks: case.yml
  vars:
    replay_case: cleanup
    replay_case_tasks: case-06-cleanup.yml
