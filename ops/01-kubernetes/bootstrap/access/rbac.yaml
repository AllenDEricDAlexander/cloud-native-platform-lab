apiVersion: v1
kind: Namespace
metadata:
  name: lab-core
  labels:
    app.kubernetes.io/part-of: cnpl-lab
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
---
# 显式白名单；不依赖会随扩展聚合变化的内置 view/edit 角色。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cnpl-observer
rules:
  - apiGroups: ['']
    resources: [nodes, namespaces, pods, replicationcontrollers, services, endpoints, events, persistentvolumes, persistentvolumeclaims, resourcequotas, limitranges]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets, controllerrevisions]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies, ingresses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cnpl-observers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cnpl-observer
subjects:
  - {kind: User, apiGroup: rbac.authorization.k8s.io, name: cnpl-mac-reader}
  - {kind: User, apiGroup: rbac.authorization.k8s.io, name: cnpl-mac-operator}
  - {kind: User, apiGroup: rbac.authorization.k8s.io, name: cnpl-adminhost-reader}
  - {kind: User, apiGroup: rbac.authorization.k8s.io, name: cnpl-adminhost-operator}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cnpl-lab-operator
  namespace: lab-core
rules:
  - apiGroups: ['']
    resources: [pods, replicationcontrollers, services, configmaps, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
  - apiGroups: ['']
    resources: [pods/exec, pods/attach, pods/portforward]
    verbs: [get, create]
  - apiGroups: ['']
    resources: [pods/ephemeralcontainers]
    verbs: [update, patch]
  - apiGroups: [apps]
    resources: [deployments, deployments/scale, replicasets, replicasets/scale, statefulsets, statefulsets/scale, daemonsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cnpl-lab-operators
  namespace: lab-core
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cnpl-lab-operator
subjects:
  - {kind: User, apiGroup: rbac.authorization.k8s.io, name: cnpl-mac-operator}
  - {kind: User, apiGroup: rbac.authorization.k8s.io, name: cnpl-adminhost-operator}
