# 角色预算以 resources.yaml 为唯一来源；原生 kubeletconfiguration 补丁在 init/join 时生效。
systemReserved:
  cpu: 2500m
  memory: 5Gi
  ephemeral-storage: 1Gi

kubeReserved:
  cpu: 500m
  memory: 1Gi
  ephemeral-storage: 2Gi

evictionHard:
  memory.available: 500Mi
  nodefs.available: 10%
  nodefs.inodesFree: 5%
  imagefs.available: 15%
  imagefs.inodesFree: 5%
  pid.available: 10%

podPidsLimit: 4096
