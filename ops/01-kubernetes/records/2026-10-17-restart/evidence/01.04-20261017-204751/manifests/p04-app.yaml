apiVersion: v1
kind: ConfigMap
metadata:
  name: p04-app
  namespace: lab-core
  labels:
    app.kubernetes.io/part-of: cnpl-pod-lab
data:
  app.sh: "#!/bin/sh\n# \u540C\u4E00\u955C\u50CF\u63D0\u4F9B\u542F\u52A8\u3001\u5065\
    \u5EB7\u3001\u5EF6\u8FDF\u53CA TERM \u89C2\u6D4B\u70B9\uFF1B01.05 \u53EF\u7EE7\
    \u7EED\u590D\u7528\u3002\nset -eu\nwork=${APP_WORK:-/work}\nif test \"${1:-}\"\
    \ = cgi; then\n  mode=${QUERY_STRING:-identity}\n  case \"$mode\" in\n    startup|live|ready)\n\
    \      if ! test -f \"$work/$mode\"; then\n        printf 'Status: 503 Service\
    \ Unavailable\\r\\nContent-Type: text/plain\\r\\n\\r\\n%s=false\\n' \"$mode\"\n\
    \        exit 0\n      fi ;;\n    delay)\n      seconds=$(cat \"$work/delay\"\
    )\n      case \"$seconds\" in 0|1|2|3|4|5) sleep \"$seconds\" ;; *) exit 1 ;;\
    \ esac ;;\n    identity) ;;\n    *) printf 'Status: 400 Bad Request\\r\\n\\r\\\
    nunknown mode\\n'; exit 0 ;;\n  esac\n  printf 'Content-Type: text/plain\\r\\\
    n\\r\\nmode=%s pod=%s node=%s\\n' \"$mode\" \"$POD_NAME\" \"$NODE_NAME\"\n  exit\
    \ 0\nfi\ncase \"${START_DELAY:-2}\" in 0|1|2|3|4|5|10|20|30) sleep \"${START_DELAY:-2}\"\
    \ ;; *) exit 2 ;; esac\nmkdir -p /work/www/cgi-bin\nprintf '#!/bin/sh\\nexec /bin/sh\
    \ /app/app.sh cgi\\n' > /work/www/cgi-bin/check\nchmod 755 /work/www/cgi-bin/check\n\
    printf 'pod=%s node=%s\\n' \"$POD_NAME\" \"$NODE_NAME\" > /work/www/index.html\n\
    touch /work/startup /work/live /work/ready\necho 0 > /work/delay\nhttpd -f -p\
    \ 8080 -h /work/www &\nserver=$!\nstop() {\n  echo \"TERM received; draining\"\
    \n  kill \"$server\"\n  wait \"$server\" || :\n  echo \"TERM complete; exit=0\"\
    \n  exit 0\n}\ntrap stop TERM INT\necho \"START ready pod=$POD_NAME node=$NODE_NAME\"\
    \nwait \"$server\"\n"
  Corefile: ".:1053 {\n    errors\n    health :18080\n    ready :18181\n}\n"
