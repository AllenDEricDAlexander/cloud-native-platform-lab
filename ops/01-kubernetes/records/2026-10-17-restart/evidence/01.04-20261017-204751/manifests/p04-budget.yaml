kind: ResourceQuota
metadata:
  name: p04-budget
  namespace: lab-core
  labels:
    app.kubernetes.io/part-of: cnpl-pod-lab
spec:
  hard:
    pods: '24'
    requests.cpu: '10'
    limits.cpu: '12'
