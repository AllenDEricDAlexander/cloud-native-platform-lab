apiVersion: v1
kind: LimitRange
metadata:
  name: p04-defaults
  namespace: lab-core
  labels:
    app.kubernetes.io/part-of: cnpl-pod-lab
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 10m
      memory: 16Mi
      ephemeral-storage: 1Mi
    default:
      cpu: 200m
      memory: 64Mi
      ephemeral-storage: 16Mi
    max:
      cpu: '8'
      memory: 256Mi
      ephemeral-storage: 128Mi
