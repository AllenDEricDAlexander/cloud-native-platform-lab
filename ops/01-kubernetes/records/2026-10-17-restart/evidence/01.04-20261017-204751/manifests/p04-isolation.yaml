apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: p04-isolation
  namespace: lab-core
  labels:
    app.kubernetes.io/part-of: cnpl-pod-lab
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: cnpl-pod-lab
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: cnpl-pod-lab
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: cnpl-pod-lab
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
