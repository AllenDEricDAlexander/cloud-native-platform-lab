apiVersion: v1
kind: Pod
metadata:
  name: p05-grpc-wrong-service
  namespace: lab-core
  labels:
    app.kubernetes.io/part-of: cnpl-probe-lab
    cnpl.io/probe-stage: protocols
    cnpl.io/probe-role: grpc-wrong-service
spec:
  restartPolicy: Always
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/hostname: worker01.k8s.internal.egon.top
  terminationGracePeriodSeconds: 25
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: harbor.k8s.internal.egon.top/bootstrap/etcd@sha256:aa2b41e3f99c9a337b82f687875a63c5119e6d39bc43fc76b6c40a96f55cf391
    imagePullPolicy: IfNotPresent
    command:
    - /usr/local/bin/etcd
    - --name=p05
    - --data-dir=/work/etcd
    - --listen-client-urls=http://0.0.0.0:2379
    - --advertise-client-urls=http://127.0.0.1:2379
    - --listen-peer-urls=http://127.0.0.1:2380
    - --initial-advertise-peer-urls=http://127.0.0.1:2380
    - --initial-cluster=p05=http://127.0.0.1:2380
    - --listen-metrics-urls=http://0.0.0.0:2381
    - --quota-backend-bytes=16777216
    - --log-level=warn
    env:
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: POD_UID
      valueFrom:
        fieldRef:
          fieldPath: metadata.uid
    - name: START_SECONDS
      value: '0'
    terminationMessagePath: /dev/termination-log
    terminationMessagePolicy: File
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
        ephemeral-storage: 1Mi
      limits:
        cpu: 500m
        memory: 256Mi
        ephemeral-storage: 384Mi
    volumeMounts:
    - name: work
      mountPath: /work
    startupProbe:
      httpGet:
        path: /health
        port: 2381
      periodSeconds: 2
      timeoutSeconds: 3
      failureThreshold: 30
    livenessProbe:
      grpc:
        port: 2379
      periodSeconds: 2
      timeoutSeconds: 3
      failureThreshold: 5
    readinessProbe:
      grpc:
        port: 2379
        service: cnpl-intentionally-missing
      periodSeconds: 2
      timeoutSeconds: 3
      failureThreshold: 1
  volumes:
  - name: work
    emptyDir:
      sizeLimit: 256Mi
