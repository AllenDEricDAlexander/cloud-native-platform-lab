apiVersion: v1
kind: Pod
metadata:
  name: p05-start-6
  namespace: lab-core
  labels:
    app.kubernetes.io/part-of: cnpl-probe-lab
    cnpl.io/probe-stage: startup
    cnpl.io/probe-role: start-6
spec:
  restartPolicy: Always
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/hostname: worker01.k8s.internal.egon.top
  terminationGracePeriodSeconds: 25
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: cnpl.local/phase01/probe-lab@sha256:f173f2e04a71e7fbf77cafca184f2aec6f5255d01d44d97a26167bda90cdbf1b
    imagePullPolicy: Never
    command:
    - /probe-lab
    - server
    env:
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: POD_UID
      valueFrom:
        fieldRef:
          fieldPath: metadata.uid
    - name: START_SECONDS
      value: '6'
    terminationMessagePath: /dev/termination-log
    terminationMessagePolicy: File
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
        ephemeral-storage: 1Mi
      limits:
        cpu: 500m
        memory: 128Mi
        ephemeral-storage: 32Mi
    volumeMounts:
    - name: work
      mountPath: /work
    startupProbe:
      httpGet:
        path: /startup
        port: 8080
      periodSeconds: 2
      timeoutSeconds: 3
      failureThreshold: 30
    livenessProbe:
      httpGet:
        path: /live
        port: 8080
      periodSeconds: 2
      timeoutSeconds: 3
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /ready
        port: 8080
      periodSeconds: 2
      timeoutSeconds: 3
      failureThreshold: 1
  volumes:
  - name: work
    emptyDir:
      sizeLimit: 32Mi
