apiVersion: v1
kind: Pod
metadata:
  name: p05-recover
  namespace: lab-core
  labels:
    app.kubernetes.io/part-of: cnpl-probe-lab
    cnpl.io/probe-stage: termination
    cnpl.io/probe-role: recover
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/hostname: worker02.k8s.internal.egon.top
  terminationGracePeriodSeconds: 25
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: cnpl.local/phase01/probe-lab@sha256:1a26cf68572fd173f6e9657548ae64e47362c0fb4f78ee3661696b92a130e1a2
    imagePullPolicy: Never
    command:
    - /probe-lab
    - server
    env:
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: POD_UID
      valueFrom:
        fieldRef:
          fieldPath: metadata.uid
    - name: START_SECONDS
      value: '0'
    - name: BROKER_URL
      value: http://p05-broker:9090
    terminationMessagePath: /dev/termination-log
    terminationMessagePolicy: File
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
        ephemeral-storage: 1Mi
      limits:
        cpu: 500m
        memory: 128Mi
        ephemeral-storage: 32Mi
    volumeMounts:
    - name: work
      mountPath: /work
    startupProbe:
      httpGet:
        path: /startup
        port: 8080
      periodSeconds: 2
      timeoutSeconds: 3
      failureThreshold: 15
    livenessProbe:
      httpGet:
        path: /live
        port: 8080
      periodSeconds: 2
      timeoutSeconds: 3
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /ready
        port: 8080
      periodSeconds: 2
      timeoutSeconds: 3
      failureThreshold: 1
    lifecycle:
      preStop:
        exec:
          command:
          - /probe-lab
          - prestop
          - '0'
  volumes:
  - name: work
    emptyDir:
      sizeLimit: 32Mi
