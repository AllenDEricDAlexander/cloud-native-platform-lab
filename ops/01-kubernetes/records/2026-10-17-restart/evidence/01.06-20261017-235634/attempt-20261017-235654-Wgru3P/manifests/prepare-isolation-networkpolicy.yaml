apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: p06-isolation
  namespace: lab-core
  labels:
    app.kubernetes.io/part-of: cnpl-controller-lab
    cnpl.io/controller-run: render-only
    cnpl.io/controller-stage: prepare
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: cnpl-controller-lab
      cnpl.io/controller-run: render-only
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: cnpl-controller-lab
          cnpl.io/controller-run: render-only
  - from:
    - ipBlock:
        cidr: 192.168.9.109/32
    - ipBlock:
        cidr: 192.168.9.110/32
    ports:
    - port: 8080
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: cnpl-controller-lab
          cnpl.io/controller-run: render-only
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
