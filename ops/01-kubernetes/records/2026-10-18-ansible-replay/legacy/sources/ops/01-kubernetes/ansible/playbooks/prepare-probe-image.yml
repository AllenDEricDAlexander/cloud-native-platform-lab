---
- name: 仅向两个实验 worker 导入 01.05 的本地静态应用镜像
  hosts: worker01:worker02
  gather_facts: false
  any_errors_fatal: true
  vars:
    probe_artifact: "{{ lookup('file', probe_artifact_file) | from_json }}"
  tasks:
    - name: 检查输入限定为本实验内容寻址镜像
      ansible.builtin.assert:
        that:
          - probe_artifact.schema_version == 1
          - probe_artifact.image is match('^cnpl.local/phase01/probe-lab@sha256:[a-f0-9]{64}$')
          - probe_artifact.image == 'cnpl.local/phase01/probe-lab@' + probe_artifact.manifest_digest
          - probe_artifact.import_tag == 'cnpl.local/phase01/probe-lab:sha256-' + probe_artifact.binary_sha256
          - probe_artifact.archive_sha256 is match('^[a-f0-9]{64}$')
          - probe_artifact.manifest_digest is match('^sha256:[a-f0-9]{64}$')
    - name: 创建独立物料目录
      ansible.builtin.file:
        path: /var/cache/cnpl/01.05
        state: directory
        mode: '0750'
    - name: 复制内容寻址 OCI 归档
      ansible.builtin.copy:
        src: "{{ probe_artifact.archive }}"
        dest: "/var/cache/cnpl/01.05/{{ probe_artifact.archive_sha256 }}.tar"
        mode: '0640'
    - name: 使用 Python 核对归档 SHA256（不依赖节点 OpenSSL）
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - "import hashlib,sys; assert hashlib.file_digest(open(sys.argv[1],'rb'),'sha256').hexdigest()==sys.argv[2], 'OCI SHA256 mismatch'"
          - "/var/cache/cnpl/01.05/{{ probe_artifact.archive_sha256 }}.tar"
          - "{{ probe_artifact.archive_sha256 }}"
      changed_when: false
    - name: 查询同名镜像的实际清单摘要
      ansible.builtin.command:
        argv: [/usr/bin/ctr, -n, k8s.io, images, list, "name=={{ probe_artifact.image }}"]
      register: probe_existing
      changed_when: false
    - name: 导入并展开 Linux amd64 镜像（不创建容器）
      ansible.builtin.command:
        argv: [/usr/bin/ctr, -n, k8s.io, images, import, --local, --platform, linux/amd64, "/var/cache/cnpl/01.05/{{ probe_artifact.archive_sha256 }}.tar"]
      when: probe_artifact.manifest_digest not in probe_existing.stdout
      changed_when: true
    - name: 建立带完整仓库名称的 Digest 引用（import 的匿名摘要名不能替代它）
      ansible.builtin.command:
        argv: [/usr/bin/ctr, -n, k8s.io, images, tag, "{{ probe_artifact.import_tag }}", "{{ probe_artifact.image }}"]
      when: probe_artifact.manifest_digest not in probe_existing.stdout
      changed_when: true
    - name: 再查镜像清单摘要
      ansible.builtin.command:
        argv: [/usr/bin/ctr, -n, k8s.io, images, list, "name=={{ probe_artifact.image }}"]
      register: probe_imported
      changed_when: false
    - name: 核对导入结果
      ansible.builtin.assert:
        that: [probe_artifact.manifest_digest in probe_imported.stdout]
    - name: 确认 CRI 可以按完整名称找到镜像
      ansible.builtin.command:
        argv: [/usr/bin/crictl, inspecti, "{{ probe_artifact.image }}"]
      changed_when: false
