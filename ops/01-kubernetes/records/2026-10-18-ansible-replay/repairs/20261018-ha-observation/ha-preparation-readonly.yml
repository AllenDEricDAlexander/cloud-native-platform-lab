---
- name: 从实际 HA 任务提取的只读参数和连通性核验（不关机、不启动观测）
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  vars_files:
  - /Users/mario/SelfProject/cloud-native-platform-lab/ops/01-kubernetes/ansible/vars/replay.yml
  vars:
    replay_root: /Users/mario/SelfProject/cloud-native-platform-lab
    replay_records: /Users/mario/SelfProject/cloud-native-platform-lab/ops/01-kubernetes/records/2026-10-18-ansible-replay/runs/03-06-20261018T051927Z-ha-fix-20261018T063407Z
    replay_attempt: /Users/mario/SelfProject/cloud-native-platform-lab/ops/01-kubernetes/records/2026-10-18-ansible-replay/repairs/20261018-ha-observation
    replay_run: 20261018T051939Z-bca4cc12
    replay_cluster_uid: 4d3e52d7-e203-4daf-aced-9c3a666fcf5b
    replay_topic: '03'
    replay_case: ha
  tasks:
  - name: 准备完成后重新核对十节点健康
    ansible.builtin.command:
      argv:
      - '{{ replay_python }}'
      - '{{ replay_check }}'
      - preflight
    register: ha_baseline_health
    changed_when: false
  - name: 人工准备之后再次核对备份时效
    ansible.builtin.command:
      argv:
      - '{{ replay_python }}'
      - '{{ replay_root }}/ops/01-kubernetes/checks/backup-check.py'
      - validate-receipt
      - --context
      - '{{ replay_records }}/context.json'
      - --input
      - '{{ replay_records }}/backup-receipt.json'
    changed_when: false
  - name: 人工准备后重新确认业务副本与 UID
    ansible.builtin.include_tasks: /Users/mario/SelfProject/cloud-native-platform-lab/ops/01-kubernetes/ansible/tasks/replay/wait-deployment.yml
    vars:
      deployment_name: p03-ha
      deployment_count: 2
      deployment_image: '{{ controller_images.v1.image }}'
  - name: 绑定观测开始时实际的两个副本 UID
    ansible.builtin.set_fact:
      ha_server_uids: '{{ deployment_state.active | map(attribute="metadata.uid") | list }}'
  - name: 此时读取实际 kube-vip 租约持有者
    ansible.builtin.command:
      argv: '{{ replay_a + [''-n'', ''kube-system'', ''get'', ''lease/plndr-cp-lock'', ''-o'', ''jsonpath={.spec.holderIdentity}''] }}'
    register: ha_holder
    changed_when: false
  - name: 目标必须是实际持有 VIP 的原控制平面
    ansible.builtin.assert:
      that:
      - (ha_baseline_health.stdout | from_json).cluster_uid == replay_cluster_uid
      - ha_holder.stdout in ['cp01.k8s.internal.egon.top', 'cp02.k8s.internal.egon.top', 'cp03.k8s.internal.egon.top']
  - name: 固定此次故障目标
    ansible.builtin.set_fact:
      ha_target: '{{ ha_holder.stdout.split(".")[0] }}'
      ha_cp_ips:
        cp01: 192.168.9.101
        cp02: 192.168.9.102
        cp03: 192.168.9.103
  - name: 固定两个存活节点和独立探测入口
    ansible.builtin.set_fact:
      ha_survivors: '{{ ha_cp_ips.keys() | reject("equalto", ha_target) | list }}'
  - name: 绑定存活观察入口和 etcd endpoint
    ansible.builtin.set_fact:
      ha_survivor: '{{ ha_survivors[0] }}'
      ha_quorum_endpoints: https://{{ ha_cp_ips[ha_survivors[0]] }}:2379,https://{{ ha_cp_ips[ha_survivors[1]] }}:2379
      ha_all_endpoints: https://{{ ha_cp_ips.cp01 }}:2379,https://{{ ha_cp_ips.cp02 }}:2379,https://{{ ha_cp_ips.cp03 }}:2379
  - name: 读取原目标节点 UID
    ansible.builtin.include_tasks: /Users/mario/SelfProject/cloud-native-platform-lab/ops/01-kubernetes/ansible/tasks/replay/get.yml
    vars:
      get_kind: node
      get_name: '{{ ha_target }}.k8s.internal.egon.top'
      get_admin: true
  - name: 保存不可更换的目标身份与业务副本
    ansible.builtin.set_fact:
      ha_binding:
        run: '{{ replay_run }}'
        cluster_uid: '{{ replay_cluster_uid }}'
        target: '{{ ha_target }}'
        target_ip: '{{ ha_cp_ips[ha_target] }}'
        target_uid: '{{ replay_object.metadata.uid }}'
        initial_holder: '{{ ha_holder.stdout }}'
        survivors: '{{ ha_survivors }}'
        server_uids: '{{ ha_server_uids }}'
  - name: 关机前从存活节点确认目标两个端口确实可达
    ansible.builtin.wait_for:
      host: '{{ ha_cp_ips[ha_target] }}'
      port: '{{ item }}'
      state: started
      timeout: 15
      connect_timeout: 2
      sleep: 1
      msg: 关机前连通性不满足：{{ ha_survivor }} -> {{ ha_target }}:{{ item }}，本轮尚未要求关机。
    delegate_to: '{{ ha_survivor }}'
    loop:
    - 22
    - 6443
    changed_when: false
  - name: 两个存活 etcd 必须健康并返回结构化结果
    ansible.builtin.command:
      argv: '{{ replay_a + [''--server=https://'' ~ ha_cp_ips[ha_survivor] ~ '':6443'', ''-n'', ''kube-system'', ''exec'', ''etcd-'' ~ ha_survivor
        ~ ''.k8s.internal.egon.top'', ''--'', ''etcdctl'', ''--endpoints='' ~ ha_quorum_endpoints, ''--cacert=/etc/kubernetes/pki/etcd/ca.crt'',
        ''--cert=/etc/kubernetes/pki/etcd/healthcheck-client.crt'', ''--key=/etc/kubernetes/pki/etcd/healthcheck-client.key'', ''endpoint'', ''health'',
        ''-w'', ''json''] }}'
    register: ha_quorum
    changed_when: false
  - name: 三成员 etcd 恢复健康
    ansible.builtin.command:
      argv: '{{ replay_a + [''-n'', ''kube-system'', ''exec'', ''etcd-'' ~ ha_survivor ~ ''.k8s.internal.egon.top'', ''--'', ''etcdctl'', ''--endpoints=''
        ~ ha_all_endpoints, ''--cacert=/etc/kubernetes/pki/etcd/ca.crt'', ''--cert=/etc/kubernetes/pki/etcd/healthcheck-client.crt'', ''--key=/etc/kubernetes/pki/etcd/healthcheck-client.key'',
        ''endpoint'', ''health'', ''-w'', ''json''] }}'
    register: ha_full_etcd
    until: ha_full_etcd.rc == 0
    retries: 30
    delay: 2
    changed_when: false
