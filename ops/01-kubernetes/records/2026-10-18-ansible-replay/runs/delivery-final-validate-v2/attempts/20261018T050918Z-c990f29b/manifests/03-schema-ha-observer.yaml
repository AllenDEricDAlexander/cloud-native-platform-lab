    terminationMessagePath: /dev/termination-log
    terminationMessagePolicy: File
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
        ephemeral-storage: 1Mi
      limits:
        cpu: 500m
        memory: 128Mi
        ephemeral-storage: 32Mi
    volumeMounts:
    - name: work
      mountPath: /work
    readinessProbe:
      tcpSocket:
        port: 8080
      periodSeconds: 2
      timeoutSeconds: 3
  volumes:
  - name: work
    emptyDir:
      sizeLimit: 32Mi
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
