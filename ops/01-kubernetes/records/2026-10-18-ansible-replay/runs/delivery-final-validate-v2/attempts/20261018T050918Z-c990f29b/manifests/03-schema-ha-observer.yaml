# Kubernetes 资源主定义；由 Ansible 渲染后直接执行，解析器不生成资源。
apiVersion: v1
kind: Pod
metadata:
  labels:
    app.kubernetes.io/part-of: cnpl-controller-lab
    cnpl.io/replay-run: '20261018T050918Z-c990f29b'
    cnpl.io/legacy-stage: 'schema'
    cnpl.io/controller-pool: client-p03-client
    cnpl.io/replay-topic: '03'
    cnpl.io/replay-case: 'schema'
  annotations:
