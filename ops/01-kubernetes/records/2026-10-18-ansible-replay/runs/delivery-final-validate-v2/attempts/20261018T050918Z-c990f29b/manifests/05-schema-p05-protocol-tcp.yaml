# Kubernetes 资源主定义；由 Ansible 渲染后直接执行，解析器不生成资源。
apiVersion: v1
kind: Pod
metadata:
  name: p05-protocol-tcp
  namespace: lab-core
  labels:
    app.kubernetes.io/part-of: cnpl-probe-lab
    cnpl.io/probe-stage: protocols
    cnpl.io/probe-role: protocol-tcp
    cnpl.io/replay-run: '20261018T050918Z-c990f29b'
    cnpl.io/replay-topic: '05'
    cnpl.io/replay-case: 'schema'
spec:
  restartPolicy: Always
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/hostname: worker01.k8s.internal.egon.top
  terminationGracePeriodSeconds: 25
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: 'cnpl.local/phase01/probe-lab@sha256:14006bb3c5070b0bcf07da634903c7d006eadb9be0a534b0a653ea3755af55c7'
    imagePullPolicy: Never
    command:
    - /probe-lab
    - server
    env:
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: POD_UID
      valueFrom:
        fieldRef:
          fieldPath: metadata.uid
    - name: START_SECONDS
      value: '0'
    terminationMessagePath: /dev/termination-log
    terminationMessagePolicy: File
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
        ephemeral-storage: 1Mi
      limits:
        cpu: 500m
        memory: 128Mi
        ephemeral-storage: 32Mi
    volumeMounts:
    - name: work
      mountPath: /work
    startupProbe:
      httpGet:
        path: /startup
        port: 8080
      periodSeconds: 2
      timeoutSeconds: 3
      failureThreshold: 15
    readinessProbe:
      tcpSocket:
        port: 8080
      periodSeconds: 2
      timeoutSeconds: 3
      failureThreshold: 1
  volumes:
  - name: work
    emptyDir:
      sizeLimit: 32Mi
