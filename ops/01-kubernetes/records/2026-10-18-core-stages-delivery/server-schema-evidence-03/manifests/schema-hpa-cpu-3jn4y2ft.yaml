apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: 'p09-load'
  namespace: 'cnpl-schema-7bceada43e'
  labels: {cnpl.io/core-run: 'schema-7bceada43e'}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: 'p09-load'}
  minReplicas: 1
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: 'cpu'
      target: {type: Utilization, averageUtilization: 60}
  behavior:
    scaleUp: {stabilizationWindowSeconds: 0, policies: [{type: Pods, value: 2, periodSeconds: 15}]}
    scaleDown: {stabilizationWindowSeconds: 30, policies: [{type: Pods, value: 4, periodSeconds: 15}]}
