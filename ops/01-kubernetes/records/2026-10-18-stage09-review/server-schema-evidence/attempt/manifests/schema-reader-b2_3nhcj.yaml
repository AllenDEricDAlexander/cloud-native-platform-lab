apiVersion: v1
kind: Pod
metadata:
  name: 'p10-reader'
  namespace: 'cnpl-schema-81dea42d'
  labels: {cnpl.io/core-run: 'schema09-81dea42d'}
spec:
  serviceAccountName: 'p10-reader'
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 10
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms: [{matchExpressions: [{key: kubernetes.io/hostname, operator: In, values: ["worker01.k8s.internal.egon.top", "worker02.k8s.internal.egon.top"]}]}]
  securityContext: {runAsUser: 1000, runAsGroup: 1000, runAsNonRoot: true, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
  containers:
  - name: app
    image: 'cnpl.local/phase01/core-lab@sha256:4984d2f8b5fbd3a0840fea611ed566f9aad7e0789544e7cf6676ac658da0f5fc'
    imagePullPolicy: Never
    command: [/core-lab, serve]
    env:
    - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
    - {name: POD_UID, valueFrom: {fieldRef: {fieldPath: metadata.uid}}}
    - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
    ports: [{name: http, containerPort: 8080}]
    securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
    resources: {requests: {cpu: 20m, memory: 32Mi, ephemeral-storage: 1Mi}, limits: {cpu: 500m, memory: 192Mi, ephemeral-storage: 32Mi}}
    readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 2, timeoutSeconds: 2}
    volumeMounts: [{name: work, mountPath: /work}, {name: identity, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}]
  volumes:
  - {name: work, emptyDir: {sizeLimit: 32Mi}}
  - name: identity
    projected:
      defaultMode: 288
      sources:
      - serviceAccountToken: {path: token, expirationSeconds: 600, audience: 'https://kubernetes.default.svc.cluster.local'}
      - configMap: {name: kube-root-ca.crt, items: [{key: ca.crt, path: ca.crt}]}
      - downwardAPI: {items: [{path: namespace, fieldRef: {fieldPath: metadata.namespace}}]}
