apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: 'p09-load'
  namespace: 'lab-p09'
  labels: {cnpl.io/core-run: '20261018T113444Z-f130c045'}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: 'p09-load'}
  minReplicas: 1
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: 'memory'
      target: {type: Utilization, averageUtilization: 120}
  behavior:
    scaleUp: {stabilizationWindowSeconds: 0, policies: [{type: Pods, value: 2, periodSeconds: 15}]}
    scaleDown: {stabilizationWindowSeconds: 30, policies: [{type: Pods, value: 4, periodSeconds: 15}]}
