apiVersion: batch/v1
kind: Job
metadata:
  name: 'p10-pull-v2'
  namespace: 'lab-p10'
  labels: {cnpl.io/core-run: '20261018T132021Z-f5b9bd22'}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 3600
  template:
