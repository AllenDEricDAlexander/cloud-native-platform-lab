---
- name: Secret 必须使用私有目录及 no_log 专用任务
  ansible.builtin.assert:
    that: tls_document.kind != 'Secret'
- name: 将公开对象写入文件，避免大 CRD 超过进程参数限制
  ansible.builtin.copy:
    content: '{{ tls_document | to_nice_json }}'
    dest: '{{ tls_attempt }}/input-{{ tls_document.kind }}-{{ tls_document.metadata.name }}.json'
    mode: '0600'
- name: 核对对象边界及原始 UID
  ansible.builtin.command:
    argv: ['{{ tls_python }}', '{{ tls_check }}', object-plan, --records, '{{ tls_records }}', --manifest, '{{ tls_attempt }}/input-{{ tls_document.kind }}-{{ tls_document.metadata.name }}.json', --output, '{{ tls_attempt }}/plan-{{ tls_document.kind }}-{{ tls_document.metadata.name }}.json']
  changed_when: false
- name: 安装后执行真实 CRD CEL 与 Webhook 严格准入预览
  ansible.builtin.command:
    argv: '{{ tls_k + ["apply","--server-side","--field-manager=cnpl-certificates","--dry-run=server","--validate=strict","-f",tls_attempt ~ "/input-" ~ tls_document.kind ~ "-" ~ tls_document.metadata.name ~ ".json"] }}'
  changed_when: false
- name: 应用本批对象
  ansible.builtin.command:
    argv: '{{ tls_k + ["apply","--server-side","--field-manager=cnpl-certificates","--validate=strict","-f",tls_attempt ~ "/input-" ~ tls_document.kind ~ "-" ~ tls_document.metadata.name ~ ".json","-o","json"] }}'
  register: tls_applied
  changed_when: true
- name: 保存公开应用结果
  ansible.builtin.copy:
    content: '{{ tls_applied.stdout }}'
    dest: '{{ tls_attempt }}/applied-{{ tls_document.kind }}-{{ tls_document.metadata.name }}.json'
    mode: '0600'
- name: 绑定原始 UID，持久组件单独登记
  ansible.builtin.command:
    argv: ['{{ tls_python }}', '{{ tls_check }}', record, --records, '{{ tls_records }}', --manifest, '{{ tls_attempt }}/applied-{{ tls_document.kind }}-{{ tls_document.metadata.name }}.json', --output, '{{ tls_attempt }}/receipt-{{ tls_document.kind }}-{{ tls_document.metadata.name }}.json']
  changed_when: false
