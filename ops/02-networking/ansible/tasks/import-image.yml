---
- name: 创建物料缓存目录
  ansible.builtin.file: {path: /var/cache/cnpl/network-baseline, state: directory, mode: '0750'}
- name: 上传按摘要标识的 OCI 包
  ansible.builtin.copy: {src: '{{ net_import.archive }}', dest: '/var/cache/cnpl/network-baseline/{{ net_import.archive_sha256 }}.tar', mode: '0640'}
- name: 核对远端传输摘要
  ansible.builtin.stat: {path: '/var/cache/cnpl/network-baseline/{{ net_import.archive_sha256 }}.tar', checksum_algorithm: sha256}
  register: net_remote_image
- name: 拒绝损坏归档
  ansible.builtin.assert: {that: net_remote_image.stat.checksum == net_import.archive_sha256}
- name: 查询现有完整 Digest 引用
  ansible.builtin.command: {argv: [/usr/bin/ctr, -n, k8s.io, images, list, 'name=={{ net_import.image }}']}
  changed_when: false
  register: net_cached
- name: 原生导入已核验平台，不连接上游
  ansible.builtin.command: {argv: [/usr/bin/ctr, -n, k8s.io, images, import, --local, --platform, linux/amd64, '/var/cache/cnpl/network-baseline/{{ net_import.archive_sha256 }}.tar']}
  when: net_import.image.split('@')[1] not in net_cached.stdout
  changed_when: true
- name: 为测试镜像建立完整摘要别名
  ansible.builtin.command: {argv: [/usr/bin/ctr, -n, k8s.io, images, tag, '{{ net_import.import_tag }}', '{{ net_import.image }}']}
  when: net_import.import_tag != net_import.image and net_import.image.split('@')[1] not in net_cached.stdout
  changed_when: true
- name: 验证 CRI 能按完整摘要找到镜像
  ansible.builtin.command: {argv: [/usr/bin/crictl, inspecti, '{{ net_import.image }}']}
  changed_when: false
  no_log: true
