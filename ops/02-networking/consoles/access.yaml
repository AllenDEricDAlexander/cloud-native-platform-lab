apiVersion: v1
kind: Namespace
metadata:
  name: cnpl-consoles
  labels:
    cnpl.io/component: management-consoles
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpl-console-reader
  namespace: cnpl-consoles
automountServiceAccountToken: false
---
# 复用 Phase 01 白名单；不授予 Secret、RBAC 管理或工作负载写权限。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cnpl-console-reader
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cnpl-observer}
subjects:
  - {kind: ServiceAccount, name: cnpl-console-reader, namespace: cnpl-consoles}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cnpl-console-metrics-reader
rules:
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cnpl-console-metrics-reader
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cnpl-console-metrics-reader}
subjects:
  - {kind: ServiceAccount, name: cnpl-console-reader, namespace: cnpl-consoles}
---
# Local 保留 Mac 源地址，使 Cilium 的 /32 限制不受 kube-proxy SNAT 影响。
apiVersion: v1
kind: Service
metadata:
  name: cnpl-hubble-ui-mac
  namespace: kube-system
  labels: {cnpl.io/component: management-consoles}
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector: {k8s-app: hubble-ui}
  ports:
    - {name: http, port: 80, targetPort: 8081, nodePort: 31235, protocol: TCP}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cnpl-headlamp-access
  namespace: cnpl-consoles
  labels: {cnpl.io/component: management-consoles}
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: cnpl-consoles}
    - fromEntities: [host]
    - fromCIDR: [192.168.9.200/32]
      toPorts:
        - ports: [{port: '4466', protocol: TCP}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cnpl-hubble-ui-access
  namespace: kube-system
  labels: {cnpl.io/component: management-consoles}
spec:
  endpointSelector:
    matchLabels: {k8s-app: hubble-ui}
  ingress:
    - fromEntities: [host]
      toPorts:
        - ports: [{port: '8081', protocol: TCP}]
    - fromCIDR: [192.168.9.200/32]
      toPorts:
        - ports: [{port: '8081', protocol: TCP}]
---
# 仅增补 UI 到 Relay 的查询授权，原管理员与 mTLS Agent 入口保持原策略。
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cnpl-hubble-ui-relay
  namespace: kube-system
  labels: {cnpl.io/component: management-consoles}
spec:
  endpointSelector:
    matchLabels: {k8s-app: hubble-relay}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: hubble-ui
      toPorts:
        - ports: [{port: '4245', protocol: TCP}]
