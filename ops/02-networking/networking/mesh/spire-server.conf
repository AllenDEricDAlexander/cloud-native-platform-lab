server {
  trust_domain = "internal.egon.top"
  bind_address = "0.0.0.0"
  bind_port = "8081"
  socket_path = "/run/spire/api.sock"
  data_dir = "/run/spire/data"
  default_x509_svid_ttl = "60s"
  agent_ttl = "120s"
  ca_ttl = "24h"
  log_level = "INFO"
}
plugins {
  DataStore "sql" {
    plugin_data {
      database_type = "sqlite3"
      connection_string = "/run/spire/data/datastore.sqlite3"
    }
  }
  KeyManager "disk" {
    plugin_data { keys_path = "/run/spire/data/keys.json" }
  }
  NodeAttestor "k8s_psat" {
    plugin_data {
      clusters = {
        "cnpl-vm" = {
          service_account_allow_list = ["spire-system:spire-agent"]
          audience = ["spire-server"]
        }
      }
    }
  }
}
