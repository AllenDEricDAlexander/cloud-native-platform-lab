---
- name: 根据原 UID 和维护字段生成精确恢复计划
  ansible.builtin.command: {argv: ['{{ metallb_python }}', '{{ metallb_check }}', restore-plan, --records, '{{ metallb_records }}', --output, '{{ metallb_attempt }}/restore-plan.json']}
  register: metallb_restore
  changed_when: false
- name: 仅恢复本批修改的调度字段，JSON Patch 自带 UID/原值测试
  ansible.builtin.command:
    argv: '{{ metallb_k + ["patch","daemonset","cnpl-metallb-speaker","-n","metallb-system","--type=json","-p",(metallb_restore.stdout | from_json).patch | to_json] }}'
  when: (metallb_restore.stdout | from_json).patch | length > 0
  changed_when: true
- name: 等待原 speaker 配置及两个就绪实例恢复
  ansible.builtin.command: {argv: ['{{ metallb_python }}', '{{ metallb_check }}', speaker-ready, --records, '{{ metallb_records }}', --output, '{{ metallb_attempt }}/speaker-restored.json']}
  register: metallb_restored
  changed_when: false
  retries: 30
  delay: 3
  until: metallb_restored.rc == 0
