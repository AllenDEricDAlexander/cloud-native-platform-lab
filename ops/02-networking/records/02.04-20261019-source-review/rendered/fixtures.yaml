spec:
  replicas: 1
  selector:
    matchLabels: {app: 'secure', cnpl.io/gateway-run: 'offline-source-review'}
  template:
    metadata:
      labels: {app: 'secure', version: 'secure', cnpl.io/gateway-run: 'offline-source-review'}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 3
      nodeSelector: {node-role.kubernetes.io/worker: ''}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector: {matchLabels: {app: 'secure', cnpl.io/gateway-run: 'offline-source-review'}}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: 'harbor.k8s.internal.egon.top/bootstrap/phase02-gateway-fixture@sha256:3891cd3b0d35896cad46be10f2095b34306a3ee75a2186df35f7d6e0e76134b5'
          imagePullPolicy: IfNotPresent
          env:
            - {name: VERSION, value: 'secure'}
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: POD_UID, valueFrom: {fieldRef: {fieldPath: metadata.uid}}}
            - {name: TLS_CERT, value: /tls/tls.crt}
            - {name: TLS_KEY, value: /tls/tls.key}
          volumeMounts: [{name: tls, mountPath: /tls, readOnly: true}]
          ports:
            - {name: http, containerPort: 8080}
            - {name: https, containerPort: 8443}
            - {name: grpc, containerPort: 50051}
            - {name: tcp, containerPort: 9000}
            - {name: udp, containerPort: 9001, protocol: UDP}
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 2, timeoutSeconds: 2}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes: [{name: tls, secret: {secretName: backend-tls, defaultMode: 288}}]
