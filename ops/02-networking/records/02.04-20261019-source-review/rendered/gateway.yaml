apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cnpl-envoy
  labels: {cnpl.io/component: phase02-gateway, cnpl.io/cluster-uid: '4d3e52d7-e203-4daf-aced-9c3a666fcf5b'}
spec:
  controllerName: gateway.envoyproxy.io/cnpl-primary-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: primary
  namespace: cnpl-gateway
  labels: {cnpl.io/component: phase02-gateway, cnpl.io/cluster-uid: '4d3e52d7-e203-4daf-aced-9c3a666fcf5b'}
spec:
  gatewayClassName: cnpl-envoy
  infrastructure:
    parametersRef: {group: gateway.envoyproxy.io, kind: EnvoyProxy, name: primary}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces: {from: Selector, selector: {matchLabels: {cnpl.io/gateway-access: primary}}}
        kinds: [{group: gateway.networking.k8s.io, kind: HTTPRoute}]
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs: [{group: '', kind: Secret, name: primary-tls}]
      allowedRoutes:
        namespaces: {from: Selector, selector: {matchLabels: {cnpl.io/gateway-access: primary}}}
        kinds: [{group: gateway.networking.k8s.io, kind: HTTPRoute}, {group: gateway.networking.k8s.io, kind: GRPCRoute}]
    - name: tcp
      protocol: TCP
      port: 9000
      allowedRoutes:
        namespaces: {from: Selector, selector: {matchLabels: {cnpl.io/gateway-access: primary}}}
        kinds: [{group: gateway.networking.k8s.io, kind: TCPRoute}]
    - name: udp
      protocol: UDP
      port: 9001
      allowedRoutes:
        namespaces: {from: Selector, selector: {matchLabels: {cnpl.io/gateway-access: primary}}}
        kinds: [{group: gateway.networking.k8s.io, kind: UDPRoute}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: primary-redirect
  namespace: cnpl-gateway
  labels: {cnpl.io/component: phase02-gateway, cnpl.io/cluster-uid: '4d3e52d7-e203-4daf-aced-9c3a666fcf5b'}
spec:
  parentRefs: [{name: primary, sectionName: http}]
  hostnames: [demo.svc.internal.egon.top, grpc-demo.svc.internal.egon.top]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, port: 443, statusCode: 301}
