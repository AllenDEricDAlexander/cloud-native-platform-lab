    helm.sh/chart: gateway-helm-v1.9.2
    app.kubernetes.io/name: gateway-helm
    app.kubernetes.io/instance: cnpl-eg
    app.kubernetes.io/version: v1.9.2
    app.kubernetes.io/managed-by: Helm
    cnpl.io/cluster-uid: 4d3e52d7-e203-4daf-aced-9c3a666fcf5b
    cnpl.io/component: phase02-gateway
spec:
  type: ClusterIP
  selector:
    control-plane: envoy-gateway
    app.kubernetes.io/name: gateway-helm
    app.kubernetes.io/instance: cnpl-eg
  ports:
  - name: grpc
    port: 18000
    targetPort: 18000
  - name: ratelimit
    port: 18001
    targetPort: 18001
  - name: wasm
    port: 18002
    targetPort: 18002
  - name: metrics
    port: 19001
    targetPort: 19001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
  labels:
    control-plane: envoy-gateway
    helm.sh/chart: gateway-helm-v1.9.2
    app.kubernetes.io/name: gateway-helm
    app.kubernetes.io/instance: cnpl-eg
    app.kubernetes.io/version: v1.9.2
    app.kubernetes.io/managed-by: Helm
    cnpl.io/cluster-uid: 4d3e52d7-e203-4daf-aced-9c3a666fcf5b
    cnpl.io/component: phase02-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: envoy-gateway
      app.kubernetes.io/name: gateway-helm
      app.kubernetes.io/instance: cnpl-eg
  template:
    metadata:
      annotations:
        prometheus.io/port: '19001'
        prometheus.io/scrape: 'true'
      labels:
        control-plane: envoy-gateway
        app.kubernetes.io/name: gateway-helm
        app.kubernetes.io/instance: cnpl-eg
    spec:
      automountServiceAccountToken: true
      nodeSelector:
        kubernetes.io/hostname: infra01.k8s.internal.egon.top
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - args:
        - server
        - --config-path=/config/envoy-gateway.yaml
        env:
        - name: ENVOY_GATEWAY_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: ENVOY_GATEWAY_SERVICE_ACCOUNT
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.serviceAccountName
        - name: ENVOY_GATEWAY_FULLNAME
          value: cnpl-eg-gateway-helm
        - name: KUBERNETES_CLUSTER_DOMAIN
          value: cluster.local
        image: harbor.k8s.internal.egon.top/bootstrap/phase02-envoy-gateway@sha256:bd722213a8433252efb56a3f6ef752c1c4d82b15e5dd8748b25973b9752c12b8
        imagePullPolicy: IfNotPresent
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /healthz
            port: 8081
          periodSeconds: 1
          successThreshold: 1
          timeoutSeconds: 1
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 1
        name: envoy-gateway
        ports:
        - containerPort: 18000
          name: grpc
        - containerPort: 18001
          name: ratelimit
        - containerPort: 18002
          name: wasm
        - containerPort: 19001
          name: metrics
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /config
          name: envoy-gateway-config
          readOnly: true
        - mountPath: /certs
          name: certs
          readOnly: true
        - mountPath: /var/lib/eg/wasm
          name: wasm-cache
      imagePullSecrets: []
      serviceAccountName: envoy-gateway
      terminationGracePeriodSeconds: 10
      volumes:
      - configMap:
          defaultMode: 420
          name: envoy-gateway-config
        name: envoy-gateway-config
      - name: certs
        secret:
          secretName: envoy-gateway
      - name: wasm-cache
        emptyDir: {}
