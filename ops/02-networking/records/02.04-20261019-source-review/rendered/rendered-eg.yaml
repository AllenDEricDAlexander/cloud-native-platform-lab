    envoyProxy:\n  provider:\n    kubernetes:\n      envoyDeployment:\n        container:\n\
    \          image: harbor.k8s.internal.egon.top/bootstrap/phase02-envoy@sha256:9c9ca6bef1e4e355b00b4657cbe123baf3b4a78613cb949b6cbabaab897a6c28\n\
    \          imagePullPolicy: IfNotPresent\n    type: Kubernetes\nextensionApis:\
    \ {}\ngateway:\n  controllerName: gateway.envoyproxy.io/cnpl-primary-controller\n\
    logging:\n  level:\n    default: info\nprovider:\n  kubernetes:\n    rateLimitDeployment:\n\
    \      container:\n        image: docker.io/envoyproxy/ratelimit:0482748e\n  \
    \    patch:\n        type: StrategicMerge\n        value:\n          spec:\n \
    \           template:\n              spec:\n                containers:\n    \
    \            - imagePullPolicy: IfNotPresent\n                  name: envoy-ratelimit\n\
    \    shutdownManager:\n      image: harbor.k8s.internal.egon.top/bootstrap/phase02-envoy-gateway@sha256:bd722213a8433252efb56a3f6ef752c1c4d82b15e5dd8748b25973b9752c12b8\n\
