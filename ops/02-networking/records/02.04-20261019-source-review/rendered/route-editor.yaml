apiVersion: v1
kind: ServiceAccount
metadata:
  name: route-editor
  namespace: lab-gateway-app
  labels: {cnpl.io/gateway-run: 'offline-source-review'}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: route-editor
  namespace: lab-gateway-app
  labels: {cnpl.io/gateway-run: 'offline-source-review'}
rules:
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes, grpcroutes, tcproutes, udproutes]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ['']
    resources: [services]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: route-editor
  namespace: lab-gateway-app
  labels: {cnpl.io/gateway-run: 'offline-source-review'}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: route-editor}
subjects: [{kind: ServiceAccount, name: route-editor, namespace: lab-gateway-app}]
