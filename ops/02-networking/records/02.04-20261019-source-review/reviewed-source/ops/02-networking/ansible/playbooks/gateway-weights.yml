---
- name: 验证两版本权重及 Header 分流
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  vars_files: [../vars/gateway.yml]
  tasks:
    - name: 创建 80/20 权重与 Header 优先路由
      ansible.builtin.include_tasks: ../tasks/gateway-apply.yml
      vars: {gateway_manifest: '{{ gateway_attempt }}/weights.yaml'}
      when: gateway_execute
    - name: 校验 200 个独立 TLS 连接分布和十个定向请求
      ansible.builtin.include_tasks: ../tasks/gateway-case.yml
      vars: {gateway_case: weights, gateway_case_retries: 3}
      when: gateway_execute
    - name: 报告手工灰度接口通过
      ansible.builtin.debug: {msg: '02.04.07 PASS；保存逐条请求与实际分布；未安装或假定 Argo Rollouts 适配器。'}
      when: gateway_execute
