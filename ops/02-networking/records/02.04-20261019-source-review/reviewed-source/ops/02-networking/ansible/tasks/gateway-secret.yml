---
- name: 私有目录渲染叶证书 Secret，不进入证据目录和日志
  ansible.builtin.template:
    src: ../../networking/gateway/tls-secret.yaml.j2
    dest: '{{ gateway_private }}/secret-{{ gateway_secret.profile }}.yaml'
    mode: '0600'
  no_log: true
- name: 私有目录转换为受检 JSON
  ansible.builtin.command:
    argv:
      - '{{ gateway_python }}'
      - -c
      - 'import json,pathlib,sys,yaml; p=pathlib.Path(sys.argv[1]); q=p.with_suffix(".json"); q.write_text(json.dumps(yaml.safe_load(p.read_text()))); q.chmod(0o600)'
      - '{{ gateway_private }}/secret-{{ gateway_secret.profile }}.yaml'
  changed_when: false
  no_log: true
- name: 检查 Secret 范围、原始 UID 和公开证书指纹
  ansible.builtin.command:
    argv: ['{{ gateway_python }}', '{{ gateway_check }}', secret-plan, --records, '{{ gateway_records }}', --manifest, '{{ gateway_private }}/secret-{{ gateway_secret.profile }}.json', --output, '{{ gateway_attempt }}/secret-plan-{{ gateway_secret.profile }}.json']
  changed_when: false
  no_log: true
- name: 服务端严格预览叶证书 Secret
  ansible.builtin.command:
    argv: '{{ gateway_k + ["apply","--server-side","--field-manager=cnpl-gateway-tls","--dry-run=server","--validate=strict","-f",gateway_private ~ "/secret-" ~ gateway_secret.profile ~ ".json","-o","name"] }}'
  changed_when: false
  no_log: true
- name: 仅上传叶证书，避免 last-applied 注解与 Secret 输出
  ansible.builtin.command:
    argv: '{{ gateway_k + ["apply","--server-side","--field-manager=cnpl-gateway-tls","--validate=strict","-f",gateway_private ~ "/secret-" ~ gateway_secret.profile ~ ".json","-o","name"] }}'
  changed_when: true
  no_log: true
- name: 只记录 Secret UID、标签和公开证书指纹
  ansible.builtin.command:
    argv: ['{{ gateway_python }}', '{{ gateway_check }}', record-secret, --records, '{{ gateway_records }}', --name, '{{ gateway_secret.name }}', --namespace, '{{ gateway_secret.namespace }}', --profile, '{{ gateway_secret.profile }}', --output, '{{ gateway_attempt }}/secret-{{ gateway_secret.profile }}.json']
  changed_when: false
