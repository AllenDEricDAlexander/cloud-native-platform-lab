---
- name: 私有目录渲染专用签发器或测试叶证书 Secret，不进入证据目录和日志
  ansible.builtin.template:
    src: ../../networking/certificates/private-secret.yaml.j2
    dest: '{{ tls_private }}/secret-{{ tls_secret.profile }}.yaml'
    mode: '0600'
  no_log: true
- name: 私有目录转换为受检 JSON
  ansible.builtin.command:
    argv:
      - '{{ tls_python }}'
      - -c
      - 'import json,pathlib,sys,yaml; p=pathlib.Path(sys.argv[1]); q=p.with_suffix(".json"); q.write_text(json.dumps(yaml.safe_load(p.read_text()))); q.chmod(0o600)'
      - '{{ tls_private }}/secret-{{ tls_secret.profile }}.yaml'
  changed_when: false
  no_log: true
- name: 检查 Secret 范围、原始 UID 和公开证书指纹
  ansible.builtin.command:
    argv: ['{{ tls_python }}', '{{ tls_check }}', secret-plan, --records, '{{ tls_records }}', --manifest, '{{ tls_private }}/secret-{{ tls_secret.profile }}.json', --output, '{{ tls_attempt }}/secret-plan-{{ tls_secret.profile }}.json']
  changed_when: false
  no_log: true
- name: 服务端严格预览私有 Secret
  ansible.builtin.command:
    argv: '{{ tls_k + ["apply","--server-side","--field-manager=cnpl-certificates-tls","--dry-run=server","--validate=strict","-f",tls_private ~ "/secret-" ~ tls_secret.profile ~ ".json","-o","name"] }}'
  changed_when: false
  no_log: true
- name: 仅上传新专用签发器或测试叶证书，避免 last-applied 与 Secret 输出
  ansible.builtin.command:
    argv: '{{ tls_k + ["apply","--server-side","--field-manager=cnpl-certificates-tls","--validate=strict","-f",tls_private ~ "/secret-" ~ tls_secret.profile ~ ".json","-o","name"] }}'
  changed_when: true
  no_log: true
- name: 只记录 Secret UID、标签和公开证书指纹
  ansible.builtin.command:
    argv: ['{{ tls_python }}', '{{ tls_check }}', record-secret, --records, '{{ tls_records }}', --name, '{{ tls_secret.name }}', --namespace, '{{ tls_secret.namespace }}', --output, '{{ tls_attempt }}/secret-{{ tls_secret.profile }}.json']
  changed_when: false
