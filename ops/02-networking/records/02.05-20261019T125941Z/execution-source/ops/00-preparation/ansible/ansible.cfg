# 在本目录（ops/00-preparation/ansible/）下运行 ansible 命令时生效；相对路径以本文件所在目录为准。
[defaults]
inventory = inventories/lab/hosts.yml
collections_path = collections
collections_scan_sys_path = False
roles_path = roles
interpreter_python = auto_silent
host_key_checking = True
forks = 10
retry_files_enabled = False

[ssh_connection]
pipelining = True
