---
phase_root: '{{ (playbook_dir ~ "/../../../..") | realpath }}'
phase_python: '{{ lookup("env","HOME") }}/.venvs/cnpl-ansible/bin/python'
phase_check: '{{ phase_root }}/ops/02-networking/tests/integration/{{ phase_topic }}/check.py'
phase_args: ['{{ phase_python }}', '{{ phase_check }}', --records, '{{ phase_records }}', --attempt, '{{ phase_attempt }}', --mode, '{{ phase_mode }}']
