---
- name: 03.02 加入 cephadm 的受控 SSH 公钥
  hosts: storage
  gather_facts: false
  tasks:
    - name: 验证公钥而非私钥
      ansible.builtin.assert:
        that:
          - lookup('file', lookup('env', 'CNPL03_CEPH_PUBLIC_KEY')) is match('^ssh-(ed25519|rsa) [A-Za-z0-9+/=]+')
    - name: 保留原 SSH 目录和身份
      ansible.builtin.file: {path: /root/.ssh, state: directory, owner: root, group: root, mode: '0700'}
    - name: 追加仅三台存储主机可使用的公钥
      ansible.builtin.lineinfile:
        path: /root/.ssh/authorized_keys
        create: true
        owner: root
        group: root
        mode: '0600'
        line: 'restrict,from="{{ groups.storage | map("extract", hostvars, "ansible_host") | join(",") }}" {{ lookup("file", lookup("env", "CNPL03_CEPH_PUBLIC_KEY")) }}'
