---
- name: 03.02 准备 cephadm 专用主机能力
  hosts: storage
  gather_facts: false
  vars:
    phase03_config: '{{ lookup("file", lookup("env", "INPUTS")) | from_json }}'
    phase03_image: '{{ lookup("env", "CNPL03_CEPH_IMAGE") }}'
    phase03_sources: '{{ groups.k8s_nodes | map("extract", hostvars, "ansible_host") | list + lab_mgmt_sources }}'
  tasks:
    - name: 安全基线与明确包版本
      ansible.builtin.assert:
        that:
          - phase03_config.ceph.packages | length >= 4
          - phase03_config.ceph.private_repositories | length > 0
          - phase03_config.ceph.packages | select('match', '^[a-zA-Z0-9_.+-]+-[0-9][a-zA-Z0-9_.+:-]*$') | list | length == phase03_config.ceph.packages | length
          - phase03_config.ceph.private_repositories | select('match', '^[a-zA-Z0-9_-]+$') | list | length == phase03_config.ceph.private_repositories | length
    - name: 安装明确版本的 Podman、cephadm、LVM、jq 及 Ceph 客户端依赖
      ansible.builtin.command:
        argv: '{{ ["dnf", "-y", "--disablerepo=*", "--enablerepo=" ~ (phase03_config.ceph.private_repositories | join(",")), "--setopt=install_weak_deps=False", "install"] + phase03_config.ceph.packages }}'
      register: phase03_packages
      changed_when: "'Nothing to do.' not in phase03_packages.stdout"
    - name: 检查 Podman 与 containerd 独立，保留安全与时间基线
      ansible.builtin.shell: |
        set -euo pipefail
        test "$(hostname -s)" = '{{ inventory_hostname }}' || exit 1
        test "$(getenforce)" = Enforcing || exit 1
        systemctl is-active --quiet firewalld containerd kubelet chronyd || exit 1
        chronyc tracking | grep -Eq 'Leap status[[:space:]]*:[[:space:]]*Normal' || exit 1
        test "$(podman info --format '{{ '{{' }}.Store.GraphRoot{{ '}}' }}')" != /var/lib/containerd || exit 1
        '{{ phase03_config.ceph.cephadm }}' check-host
      args: {executable: /bin/bash}
      changed_when: false
    - name: 拉取锁定的内网 Ceph 镜像（只在 VM，沿用受控 registry auth）
      ansible.builtin.command: {argv: [podman, pull, '{{ phase03_image }}']}
      changed_when: true
    - name: Ceph 数据路径按所有消费者和管理端来源放行
      ansible.builtin.include_tasks: firewall.yml
      loop: '{{ phase03_sources | product(["3300", "6789", "6800-7568", "9443"]) | list }}'
      loop_control: {loop_var: phase03_rule}
