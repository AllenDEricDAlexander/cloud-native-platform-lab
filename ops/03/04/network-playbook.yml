---
- name: 03.04 从全部潜在卷消费者检查 MON 路径
  hosts: k8s_nodes
  gather_facts: false
  tasks:
    - name: 确认主机与内核客户端，不安装/重启服务
      ansible.builtin.shell: |
        set -euo pipefail
        test "$(hostname -s)" = '{{ inventory_hostname }}' || exit 1
        test "$(getenforce)" = Enforcing || exit 1
        systemctl is-active --quiet firewalld containerd kubelet || exit 1
        modinfo rbd >/dev/null
        modinfo ceph >/dev/null
        modinfo nbd >/dev/null
        modinfo fuse >/dev/null
        # mount.ceph/rbd 用户态工具由锁定的 CSI 镜像提供，不要求宿主机安装 ceph-common。
        printf 'PASS kernel RBD/CephFS modules; userspace helpers supplied by CSI image\n'
      args: {executable: /bin/bash}
      changed_when: false
    - name: 三 MON messenger v2/v1 端口
      ansible.builtin.wait_for:
        host: '{{ hostvars[item.0].ansible_host }}'
        port: '{{ item.1 }}'
        timeout: 10
        connect_timeout: 3
      loop: '{{ groups.storage | product([3300, 6789]) | list }}'
      changed_when: false
