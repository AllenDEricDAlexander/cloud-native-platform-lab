apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: rbd}
spec:
  storageClassName: cnpl03-rbd
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: shared}
spec:
  storageClassName: cnpl03-cephfs
  accessModes: [ReadWriteMany]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: exclusive}
spec:
  storageClassName: cnpl03-rbd
  accessModes: [ReadWriteOncePod]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Pod
metadata: {name: rbd-writer}
spec:
  nodeSelector: {kubernetes.io/hostname: worker01}
  securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
  containers:
    - name: probe
      image: harbor.k8s.internal.egon.top/unconfigured/probe:pending
      command: [sh, -c, 'sleep 86400']
      resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
      volumeMounts: [{name: data, mountPath: /data}]
  volumes: [{name: data, persistentVolumeClaim: {claimName: rbd}}]
---
apiVersion: v1
kind: Pod
metadata: {name: fs-a}
spec:
  nodeSelector: {kubernetes.io/hostname: worker01}
  securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
  containers:
    - name: probe
      image: harbor.k8s.internal.egon.top/unconfigured/probe:pending
      command: [sh, -c, 'sleep 86400']
      resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
      volumeMounts: [{name: data, mountPath: /data}]
  volumes: [{name: data, persistentVolumeClaim: {claimName: shared}}]
---
apiVersion: v1
kind: Pod
metadata: {name: fs-b}
spec:
  nodeSelector: {kubernetes.io/hostname: worker02}
  securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
  containers:
    - name: probe
      image: harbor.k8s.internal.egon.top/unconfigured/probe:pending
      command: [sh, -c, 'sleep 86400']
      resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
      volumeMounts: [{name: data, mountPath: /data}]
  volumes: [{name: data, persistentVolumeClaim: {claimName: shared}}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: ordinal}
spec:
  serviceName: ordinal
  replicas: 2
  selector: {matchLabels: {app: ordinal}}
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  template:
    metadata: {labels: {app: ordinal}}
    spec:
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      containers:
        - name: probe
          image: harbor.k8s.internal.egon.top/unconfigured/probe:pending
          command: [sh, -c, 'test -f /data/identity || hostname > /data/identity; sleep 86400']
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        storageClassName: cnpl03-rbd
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: ordinal}
spec:
  clusterIP: None
  selector: {app: ordinal}
  ports: [{name: probe, port: 8080}]
