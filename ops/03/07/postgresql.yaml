apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: baseline}
spec:
  storageClassName: cnpl03-rbd
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: baseline-init}
data:
  01-app.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    psql --username postgres --dbname postgres --set ON_ERROR_STOP=1 <<'PSQL'
    \getenv app_password CNPL_APP_PASSWORD
    CREATE ROLE app LOGIN PASSWORD :'app_password';
    CREATE DATABASE app OWNER app;
    PSQL
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: baseline}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: baseline}}
  template:
    metadata: {labels: {app: baseline}}
    spec:
      containers:
        - name: postgres
          image: harbor.k8s.internal.egon.top/unconfigured/postgresql:pending
          env:
            - {name: POSTGRES_PASSWORD_FILE, value: /secrets/super/password}
            - {name: CNPL_APP_PASSWORD, valueFrom: {secretKeyRef: {name: pg-app, key: password}}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{name: postgres, containerPort: 5432}]
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 1Gi}}
          readinessProbe: {exec: {command: [pg_isready, -U, postgres, -d, postgres]}, initialDelaySeconds: 5, periodSeconds: 5}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: superuser, mountPath: /secrets/super, readOnly: true}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: baseline}}
        - {name: superuser, secret: {secretName: pg-superuser}}
        - {name: init, configMap: {name: baseline-init, defaultMode: 365}}
---
apiVersion: v1
kind: Service
metadata: {name: baseline}
spec:
  selector: {app: baseline}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: v1
kind: Pod
metadata: {name: pg-client}
spec:
  containers:
    - name: client
      image: harbor.k8s.internal.egon.top/unconfigured/postgresql:pending
      command: [sh, -c, 'sleep 86400']
      env: [{name: PGPASSFILE, value: /auth/pgpass}]
      volumeMounts: [{name: auth, mountPath: /auth, readOnly: true}]
      resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
  volumes: [{name: auth, secret: {secretName: pg-client, defaultMode: 256}}]
