apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: brokers
  labels: {strimzi.io/cluster: kafka}
spec:
  replicas: 3
  roles: [controller, broker]
  storage:
    type: jbod
    volumes: [{id: 0, type: persistent-claim, size: 2Gi, class: cnpl03-rbd, deleteClaim: false, kraftMetadata: shared}]
  resources: {requests: {cpu: 100m, memory: 512Mi}, limits: {memory: 1Gi}}
  template:
    pod:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions: [{key: cnpl.io/phase03-data, operator: In, values: ['true']}]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: cnpl.io/esxi
              labelSelector: {matchLabels: {strimzi.io/pool-name: brokers}}
      tolerations: [{operator: Exists, effect: NoSchedule}]
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka
  annotations: {strimzi.io/kraft: enabled, strimzi.io/node-pools: enabled}
spec:
  kafka:
    version: pending
    image: harbor.k8s.internal.egon.top/unconfigured/kafka:pending
    metadataVersion: pending
    listeners: [{name: tls, port: 9093, type: internal, tls: true, authentication: {type: tls}}]
    authorization: {type: simple}
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
    rack: {topologyKey: cnpl.io/esxi}
  entityOperator: {topicOperator: {}, userOperator: {}}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: cnpl03-client
  labels: {strimzi.io/cluster: kafka}
spec:
  authentication: {type: tls}
  authorization:
    type: simple
    acls:
      - resource: {type: topic, name: cnpl03-, patternType: prefix}
        operations: [Create, Describe, Read, Write]
      - resource: {type: group, name: cnpl03-, patternType: prefix}
        operations: [Read, Describe]
