apiVersion: platform.egon.top/v1alpha1
kind: DevApplication
metadata:
  name: '${{ values.name }}'
  annotations: {argocd.argoproj.io/sync-wave: '-1'}
spec:
  parameters: {serviceName: '${{ values.name }}', language: '${{ values.language }}', dataService: '${{ values.dataService }}'}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: '${{ values.name }}'
  annotations: {argocd.argoproj.io/sync-wave: '1'}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: '${{ values.name }}'}}
  template:
    metadata: {labels: {app.kubernetes.io/name: '${{ values.name }}'}}
    spec:
      serviceAccountName: application
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: app
          image: application
          ports: [{containerPort: 8080}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: '1', memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /ready, port: 8080}}
          livenessProbe: {httpGet: {path: /health, port: 8080}}
---
apiVersion: v1
kind: Service
metadata: {name: '${{ values.name }}'}
spec:
  selector: {app.kubernetes.io/name: '${{ values.name }}'}
  ports: [{port: 8080, targetPort: 8080}]
