apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: '${{ values.name }}'
  annotations:
    backstage.io/techdocs-ref: dir:.
    gitlab.com/project-slug: 'cnpl-apps/${{ values.name }}'
    jenkins.io/job-full-name: 'cnpl-apps/${{ values.name }}/main'
spec:
  type: service
  lifecycle: experimental
  owner: '${{ values.owner }}'
  providesApis: ['${{ values.name }}']
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata: {name: '${{ values.name }}'}
spec:
  type: openapi
  lifecycle: experimental
  owner: '${{ values.owner }}'
  definition: |
    openapi: 3.0.3
    info: {title: '${{ values.name }}', version: 1.0.0}
    paths:
      /health:
        get:
          responses: {'200': {description: Healthy}}
      /compute:
        get:
          responses: {'200': {description: Computed}, '500': {description: Controlled failure}}
