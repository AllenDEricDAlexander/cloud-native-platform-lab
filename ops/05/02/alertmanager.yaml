global:
  resolve_timeout: 2m
route:
  receiver: platform
  group_by: [alertname, service, environment, team]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: platform
      group_wait: 10s
inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [service, environment, team]
receivers:
  - name: platform
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/notify/url
        send_resolved: true
