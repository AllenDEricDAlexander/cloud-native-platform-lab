[SERVICE]
    Flush 2
    Log_Level warn
    Parsers_File /fluent-bit/etc/parsers.conf
    storage.path /buffers/storage
    storage.sync normal
    storage.max_chunks_up 32
    storage.backlog.mem_limit 16M
    HTTP_Server On
    HTTP_Listen 0.0.0.0
    HTTP_Port 2020
[INPUT]
    Name tail
    Tag kube.*
    Path /var/log/containers/*.log
    multiline.parser docker, cri
    DB /buffers/tail.db
    DB.Sync Normal
    Read_from_Head Off
    Refresh_Interval 5
    Rotate_Wait 30
    Mem_Buf_Limit 16M
    Skip_Long_Lines On
    storage.type filesystem
[FILTER]
    Name kubernetes
    Match kube.*
    Merge_Log On
    Keep_Log Off
    K8S-Logging.Parser Off
    K8S-Logging.Exclude On
    Labels On
    Annotations Off
[FILTER]
    Name lua
    Match kube.*
    script /fluent-bit/etc/privacy.lua
    call sanitize
