input {
  http {
    port => 8080
    codec => json
    ssl_enabled => true
    ssl_certificate => "/tls/tls.crt"
    ssl_key => "/tls/tls.pkcs8.key"
    ssl_certificate_authorities => ["/tls/ca.crt"]
    ssl_client_authentication => "required"
    request_headers_target_field => "[@metadata][headers]"
    remote_host_target_field => "[@metadata][remote]"
  }
}
filter {
  ruby {
    code => '
      allowed = %w[@timestamp message service_name environment version severity namespace trace_id span_id error_type tags]
      event.to_hash.keys.each { |k| event.remove(k) unless allowed.include?(k) }
      msg = event.get("message").to_s
      if msg.start_with?("{")
        begin
          parsed = LogStash::Json.load(msg)
          %w[message severity error_type trace_id span_id].each { |k| event.set(k, parsed[k]) if parsed.key?(k) }
        rescue StandardError
          event.tag("cnpl_parse_failure")
        end
      end
      msg = event.get("message").to_s.gsub(/CNPL_TEST_SECRET_[A-Za-z0-9_-]+/, "[REDACTED]").gsub(/(?i)(password|token|authorization|cookie)\s*[=:]\s*[^ ,;]+/, "[REDACTED]")
      event.set("message", msg)
      %w[trace_id span_id].each do |k|
        value = event.get(k)
        event.remove(k) if value && !(value.to_s =~ /\A[a-f0-9]{#{k == "trace_id" ? 32 : 16}}\z/)
      end
    '
  }
}
output {
  if "cnpl_parse_failure" in [tags] {
    elasticsearch {
      hosts => ["${ES_URL}"]
      user => "${ES_USER}"
      password => "${ES_PASSWORD}"
      ssl_enabled => true
      ssl_certificate_authorities => ["/es-ca/ca.crt"]
      index => "${INDEX_PREFIX}-failed-%{+YYYY.MM.dd}"
      ilm_enabled => false
      manage_template => false
    }
  } else {
    elasticsearch {
      hosts => ["${ES_URL}"]
      user => "${ES_USER}"
      password => "${ES_PASSWORD}"
      ssl_enabled => true
      ssl_certificate_authorities => ["/es-ca/ca.crt"]
      index => "${INDEX_PREFIX}-%{+YYYY.MM.dd}"
      ilm_enabled => false
      manage_template => false
    }
  }
}
