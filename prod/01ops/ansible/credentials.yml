---
- name: 只向 admin 分发本阶段需要的应用凭据
  hosts: nexus_servers:harbor_servers
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: admin 本地秘密目录
      ansible.builtin.file:
        path: /home/ops/.local/share/cnpl/secrets
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false
    - name: 选定本角色可分发的有限凭据
      ansible.builtin.set_fact:
        cnpl_credential_files: "{{ ['cnpl-reader-user.json', 'nexus-reader.netrc'] if inventory_hostname == 'nexus' else ['harbor-publisher.json', 'harbor-reader.json'] }}"
    - name: 受控取回，不分发管理员、CA 或部署私钥
      ansible.builtin.fetch:
        src: '/etc/cnpl/secrets/{{ item }}'
        dest: '/home/ops/.local/share/cnpl/secrets/{{ item }}'
        flat: true
      loop: '{{ cnpl_credential_files }}'
      no_log: true
      diff: false
    - name: 本地秘密文件权限
      ansible.builtin.file:
        path: '/home/ops/.local/share/cnpl/secrets/{{ item }}'
        mode: '0600'
      loop: '{{ cnpl_credential_files }}'
      delegate_to: localhost
      become: false
      no_log: true
