---
- ansible.builtin.import_tasks: deploy-tools.yml
- name: 建立本机公开输入目录与秘密目录
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: /etc/cnpl/inputs, mode: '0750'}
    - {path: /etc/cnpl/secrets, mode: '0700'}
- name: 接入已验收的内网 CA、DNS 与签名源
  ansible.builtin.import_tasks: trust-repos.yml
- name: 普通客户端使用内网时间源
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../config/chrony-client.conf"
    dest: /etc/chrony.conf
    mode: '0644'
    backup: true
  register: cnpl_time_config
  when: inventory_hostname not in groups.dns_servers
- name: 仅配置变化时重启 chronyd
  ansible.builtin.systemd_service:
    name: chronyd
    enabled: true
    state: "{{ 'restarted' if cnpl_time_config is changed else 'started' }}"
  when: inventory_hostname not in groups.dns_servers
- name: 核验 VMware 时间同步由人工 Web 设置关闭
  ansible.builtin.command: vmware-toolbox-cmd timesync status
  environment: {LC_ALL: C}
  register: cnpl_vmware_time
  changed_when: false
  failed_when: false
  check_mode: false
- name: 不通过脚本操作虚拟化设置
  ansible.builtin.assert:
    that: cnpl_vmware_time.stdout | trim == 'Disabled'
    quiet: true
- name: 本机日志持久化目录
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: /var/log/journal, group: systemd-journal, mode: '2755'}
    - {path: /etc/systemd/journald.conf.d, group: root, mode: '0755'}
- name: 持久化日志容量基线
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/10-cnpl.conf
    mode: '0644'
    content: |
      [Journal]
      Storage=persistent
      SystemMaxUse=2G
      SystemKeepFree=1G
      MaxRetentionSec=30day
      Compress=yes
  register: cnpl_journal_config
- name: 生效日志配置
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
  when: cnpl_journal_config is changed
- name: 确保持久日志已刷新
  ansible.builtin.command: journalctl --flush
  changed_when: false
  when: cnpl_journal_config is changed
