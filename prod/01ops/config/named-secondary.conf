acl cnpl_clients { 127.0.0.1; 192.168.9.10; 192.168.9.11; 192.168.9.12; 192.168.9.13; 192.168.9.14; 192.168.9.15; 192.168.9.16; 192.168.9.17; 192.168.9.160; 192.168.9.101; 192.168.9.102; 192.168.9.103; 192.168.9.104; 192.168.9.105; 192.168.9.106; 192.168.9.107; 192.168.9.108; 192.168.9.109; 192.168.9.110; };
options {
    directory "/var/named";
    listen-on port 53 { 127.0.0.1; 192.168.9.17; };
    listen-on-v6 { none; };
    allow-query { cnpl_clients; };
    allow-recursion { cnpl_clients; };
    allow-query-cache { cnpl_clients; };
    allow-transfer { none; };
    recursion yes;
    forwarders { 192.168.9.1; };
    dnssec-validation auto;
};
zone "internal.egon.top" IN {
    type secondary;
    primaries { 192.168.9.11; };
    file "slaves/cnpl-forward.zone";
};
zone "9.168.192.in-addr.arpa" IN {
    type secondary;
    primaries { 192.168.9.11; };
    file "slaves/cnpl-reverse.zone";
};
