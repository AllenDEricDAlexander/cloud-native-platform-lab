# /etc/nginx/conf.d/cnpl-nexus.conf
server {
    listen 192.168.9.14:443 ssl;
    server_name nexus.svc.internal.egon.top;
    ssl_certificate /etc/cnpl/tls/fullchain.crt;
    ssl_certificate_key /etc/cnpl/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1g;
    allow 192.168.9.14;
    allow 192.168.9.15;
    allow 192.168.9.160;
    deny all;
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}
