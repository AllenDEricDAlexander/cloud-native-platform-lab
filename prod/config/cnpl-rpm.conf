# /etc/nginx/conf.d/cnpl-rpm.conf
server {
    listen 192.168.9.14:443 ssl;
    server_name rpm.svc.internal.egon.top;
    ssl_certificate /etc/cnpl/tls/fullchain.crt;
    ssl_certificate_key /etc/cnpl/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    allow 192.168.9.10;
    allow 192.168.9.11;
    allow 192.168.9.12;
    allow 192.168.9.13;
    allow 192.168.9.14;
    allow 192.168.9.15;
    allow 192.168.9.16;
    allow 192.168.9.17;
    allow 192.168.9.160;
    allow 192.168.9.101;
    allow 192.168.9.102;
    allow 192.168.9.103;
    allow 192.168.9.104;
    allow 192.168.9.105;
    allow 192.168.9.106;
    allow 192.168.9.107;
    allow 192.168.9.108;
    allow 192.168.9.109;
    allow 192.168.9.110;
    deny all;
    location /keys/ { alias /srv/nexus/repos/keys/; autoindex off; }
    location / { root /srv/nexus/repos/current; autoindex off; }
}
